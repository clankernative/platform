[workspace]
members = ["crates/worker", "crates/xtask", "crates/day2", "crates/day2-assets", "crates/day2-contracts", "crates/day2-control", "crates/day2-kernel", "crates/day2-capabilities", "crates/durable-temporal", "crates/day2-ops", "crates/day2-sandbox", "cli/checks"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.98"

[profile.release]
panic = "abort"

# Tests exercise real workers, real SQLite and generated campaigns, so their cost
# is platform CPU rather than compilation. Unoptimized hashing and JSON decoding
# dominated the campaign suites: People Ops' four-cycle campaign ran 1301s at
# opt-level 0 and 130s here, with identical assertions. `test` inherits this.
# Dependencies such as sha2 and serde_json build once at opt-level 2; workspace
# crates rebuild on every edit, so they use opt-level 1 to keep recompiles short.
# Debug assertions and overflow checks are deliberately left enabled.
[profile.dev]
opt-level = 1
# Debug info, not code, dominated the build tree. Unpacked, it left 70.6 GB of
# per-codegen-unit object files; packed, every test binary link ran dsymutil and
# left a .dSYM bundle behind (6.2 GB for one build of the test targets). Panic
# messages keep their file and line without it, because those locations are
# compiled in; only backtrace frames lose line numbers. Ask for them with
# CARGO_PROFILE_DEV_DEBUG=line-tables-only, or for locals with =true.
debug = false

[profile.dev.package."*"]
opt-level = 2
