[workspace]
members = ["crates/worker", "crates/xtask", "crates/day2", "crates/day2-assets", "crates/day2-contracts", "crates/day2-control", "crates/day2-kernel", "crates/day2-capabilities", "crates/durable-temporal", "crates/day2-ops", "crates/day2-sandbox", "cli/checks"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.98"

[patch.crates-io]
# Own every kernel-installed sender pidfd before validating ancillary messages.
rustix = { git = "https://github.com/clankernative/rustix", rev = "6f3845cfc5b1ac7f490e6fe9641eed720c99f6d0" }


# Compiler profiles live only in build/bazel and .bazelrc. This manifest is a
# crate_universe dependency input, not a supported Cargo build entry point.
