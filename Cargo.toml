[workspace]
members = ["crates/worker", "crates/xtask", "crates/day2", "crates/day2-control", "crates/day2-kernel", "crates/day2-capabilities", "crates/durable-temporal", "crates/day2-ops", "crates/day2-sandbox", "cli/checks"]
exclude = ["vendor/clanker-ui-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.98"

[profile.release]
panic = "abort"

# Tests exercise real workers, real SQLite and generated campaigns, so their cost
# is platform CPU rather than compilation. Unoptimized hashing and JSON decoding
# dominated the campaign suites: People Ops' four-cycle campaign ran 1301s at
# opt-level 0 and 130s here, with identical assertions. `test` inherits this, and
# dependencies build with `dev`, so both the platform and sha2/serde_json are
# optimized. Debug assertions and overflow checks are deliberately left enabled.
[profile.dev]
opt-level = 2
# Debug info, not code, dominated the build tree: 70.6 GB across 238,661 object
# files, because macOS leaves unpacked per-codegen-unit debug info behind and
# nothing collects it. Line tables keep file and line numbers in panics and
# backtraces at 6.8x less debug info; a debugger session that needs locals can
# ask for them with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"
split-debuginfo = "packed"
