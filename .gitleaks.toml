title = "Platform public source secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Public schema identity keys, not authentication credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)(fixtures/[^/]+|examples/reports|examples/notifications)/model-identities\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"key": "[a-f0-9]{32}",?$''',
  '''^\s*"identity": \{\s*"key": "[a-f0-9]{32}", "prefix": "[a-z]+"\s*\},?$''',
]

[[allowlists]]
description = "Public Request model identity in the legacy compact fixture ledger"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^fixtures/request-desk/model-identities\.json$''']
regexTarget = "line"
regexes = ['''^\s*"models": \[\{ "identity": \{ "key": "[a-f0-9]{32}", "prefix": "rqt" \}, "table": "requests", "roc_type": "Models\.Request", "retired": false \}\]$''']

[[allowlists]]
description = "Public Reservation model identity in the legacy compact fixture ledger"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^fixtures/stock-ledger/model-identities\.json$''']
regexTarget = "line"
regexes = ['''^\s*"models": \[\{ "identity": \{ "key": "[a-f0-9]{32}", "prefix": "rsv" \}, "table": "reservations", "roc_type": "Models\.Reservation", "retired": false \}\]$''']

[[allowlists]]
description = "Public nominal identity rows in the Notifications model ledger"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)examples/notifications/model-identities\.json$''']
regexTarget = "line"
regexes = ['''^\s*\{ "identity": \{ "key": "[a-f0-9]{32}", "prefix": "[a-z]+" \}, "table": "[a-z_]+", "roc_type": "Models\.[A-Za-z]+", "retired": (true|false) \},?$''']

[[allowlists]]
description = "Public schema identity keys embedded in admission fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/day2/src/app_inference\.rs$''']
regexTarget = "line"
regexes = ['''^\s*\{"identity": \{"key": "[a-f0-9]{32}", "prefix": "[a-z]+"\},$''']

[[allowlists]]
description = "Public schema identity keys in the compiler inference test ledger"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/day2/src/app_inference\.rs$''']
regexTarget = "line"
regexes = ['''^\s*\{"identity": \{"key": "(b41c7d2e8a95f60312ad4e7b9c06f158|f70a1b6c93de5827401c8fa3b6e29d5f|0123456789abcdef0123456789abcdef)", "prefix": "(cmp|add|old)"\},$''']

[[allowlists]]
description = "Exact public alerts-webhook revision-1 reference hash used as a mounted filename in the mocked release test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)deploy/gke/stacks/day2-app/tests/day2-app\.tftest\.hcl$''']
regexTarget = "line"
regexes = ['''^\s*key\s*=\s*"ef04e428d3b9a659ce6eaee5c890220e9ff59ac9f9b3889f2176569021744d2a"\s*$''']

[[allowlists]]
description = "Documentation generator references an environment variable, never a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)crates/day2/src/api_examples\.rs$''']
regexTarget = "line"
regexes = ['''\("Idempotency-Key", "DAY2_IDEMPOTENCY_KEY", true\),''']
