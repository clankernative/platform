[package]
name = "day2-control"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
day2-contracts = { path = "../day2-contracts" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
crc32c = "0.6"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "3.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
ring = "=0.17.14"
url = "2.5"
day2 = { path = "../day2" }
day2-capabilities = { path = "../day2-capabilities" }
day2-kernel = { path = "../day2-kernel" }
durable-temporal = { path = "../durable-temporal" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
day2-assets = { path = "../day2-assets" }
# Keep in-process generators without optional subprocess or bit-set dependencies.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
axum = "0.8.9"

[[test]]
name = "control_integration"
path = "tests/main.rs"
