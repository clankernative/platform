day2-control = { path = "../day2-control" }
day2-ops = { path = "../day2-ops" }
tempfile = "3.27"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
