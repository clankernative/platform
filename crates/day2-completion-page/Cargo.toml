[package]
name = "day2-completion-page"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Build-time qualification only; no runtime/native configuration selector.
qualification-libc = ["rustix/use-libc"]
kernel-qualification = []

[target.'cfg(target_os = "linux")'.dependencies]
# The optional libc deps are available to the separate backend qualification;
# enabling them does not select use-libc or change the default backend.
rustix = { version = "=1.1.5", features = ["fs", "mm", "net", "process", "try_close", "libc", "libc_errno"] }

[dev-dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.27"
