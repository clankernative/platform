name: Completion page Linux qualification
on:
  pull_request:
    paths:
      - crates/day2-completion-page/**
      - .github/workflows/completion-page.yml
      - build/bazel/**
      - .bazelrc
      - rust-toolchain.toml
      - Cargo.toml
      - .github/actions/pinned-release/action.yml
      - BUILD.bazel
      - Cargo.lock
      - MODULE.bazel*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: completion-page-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [linux_raw, libc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualify the immutable reviewed source head, not a moving merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the pinned Linux Bazel executable
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: bazelbuild/bazel
          tag: 9.3.0
          asset: bazel-9.3.0-linux-x86_64
          sha256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          path: /tmp/completion-bazel
      - name: Verify the pinned executable
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/completion-bazel' | sha256sum --check
      - name: Install the pinned executable
        run: install -m 0555 /tmp/completion-bazel /usr/local/bin/bazel
      # One atomic ABI unit harness, no provider/native owner or F recipe. Its
      # receipt requires all15 real cases and the ACTUAL rustix producer cfg.
      - name: Qualify the actual fixed ABI on the selected backend
        run: bazel --batch --nosystem_rc --nohome_rc test --define=DAY2_COMPLETION_BACKEND=${{ matrix.backend }} --verbose_failures=false --announce_rc=false --test_output=errors --zip_undeclared_test_outputs //crates/day2-completion-page:kernel_qualification
      - name: Require the complete bounded kernel evidence archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: completion-page-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bazel-testlogs/crates/day2-completion-page/kernel_qualification/test.outputs/outputs.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain the actual selected test executable separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: completion-page-executable-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bazel-bin/crates/day2-completion-page/kernel_qualification
          if-no-files-found: error
          retention-days: 14
