name: Native image qualification
on:
  pull_request:
    paths:
      - .github/workflows/native-images.yml
      - deploy/linux-sqlite/Dockerfile
      - deploy/gke/images/native-enrollment/Dockerfile
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-tooling-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned Linux Bazel executable
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: bazelbuild/bazel
          tag: 9.3.0
          asset: bazel-9.3.0-linux-x86_64
          sha256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          path: /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64
      - name: Verify the pinned Linux Bazel bytes
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        run: sudo install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore checksum-addressed Bazel source downloads
        continue-on-error: true
        timeout-minutes: 3
        id: bazel_repositories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: day2-bazel-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
        with:
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false
          cache-save: true
      - name: Restore compiled image qualification tools
        id: bazel_actions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: day2-bazel-native-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-native-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-
            day2-bazel-native-images-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - name: Enforce current native source policy and dependency proofs
        run: build-out/bin/xtask architecture-check
      - name: Download pinned roc_nightly-linux_x86_64-2026-10-13-b17d287.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/nightlies
          tag: nightly-2026-10-13-b17d287
          asset: roc_nightly-linux_x86_64-2026-10-13-b17d287.tar.gz
          sha256: 3b613b155be6ea04c9a1ae4e315fb4cf911e2d0b7096708d07ef147647da578b
          path: .cache/day2-release/3b613b155be6ea04c9a1ae4e315fb4cf911e2d0b7096708d07ef147647da578b
      - name: Download pinned Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/basic-cli
          tag: 0.26.0-rc2
          asset: Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst
          sha256: 5778e6dc0354d5e7fb5b0725eff8e04da3c8d656049c63b43e3cc275ebefaf8b
          path: .cache/day2-release/5778e6dc0354d5e7fb5b0725eff8e04da3c8d656049c63b43e3cc275ebefaf8b
      - name: Download pinned 6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/http
          tag: 1.0.0
          asset: 6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst
          sha256: e9efaa950e72f6f76cdf6eaf00424572fa69b04ba612732357ac0453678f02b4
          path: .cache/day2-release/e9efaa950e72f6f76cdf6eaf00424572fa69b04ba612732357ac0453678f02b4
      - name: Download pinned clanker-ui-native-0.2.2-linux-x86_64.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: clankernative/clanker-ui
          tag: v0.2.2
          asset: clanker-ui-native-0.2.2-linux-x86_64.tar.gz
          sha256: 023482d8cb809621149ee9a67990bc999323082130d368fc49e8810909d9229e
          path: .cache/day2-release/023482d8cb809621149ee9a67990bc999323082130d368fc49e8810909d9229e
      - name: Bootstrap current pinned native inputs
        run: build-out/bin/xtask bootstrap
      - name: Execute the ordinary Linux image and native admission recipe
        run: build-out/bin/xtask qualify-linux artifacts/native-images
      - name: Retain image identities and public qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: native-image-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          # Protected operation/build logs in nested directories stay job-local.
          path: |
            artifacts/native-images/*.json
            artifacts/native-images/*.log
            artifacts/native-images/*.id
            artifacts/native-images/operator.tar.gz
          if-no-files-found: warn
      - name: Persist compiled tools without caching native outcomes
        if: ${{ !cancelled() && steps.bazel_actions.outputs.cache-primary-key != '' && steps.bazel_actions.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.bazel_actions.outputs.cache-primary-key }}
  native-enrollment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source-bound native enrollment runtime image
        run: docker build --target runtime --iidfile /tmp/day2-enrollment-image.id -f deploy/gke/images/native-enrollment/Dockerfile .
      - name: Retain the actual enrollment image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: native-enrollment-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-enrollment-image.id
          if-no-files-found: error
