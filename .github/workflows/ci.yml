name: Platform CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      verification:
        description: Complete Linux and focused Mac verification, or independent diagnostics
        type: choice
        options: [sharded, diagnostics]
        default: sharded
      compilation_cache:
        description: Reuse admitted compiled outputs, or measure complete verification with empty compiled-output caches
        type: choice
        options: [reuse, empty]
        default: reuse

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir /tmp/scanners
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/gitleaks.sha256"
        working-directory: /tmp/scanners
      - run: tar -xzf /tmp/scanners/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/scanners
      - run: /tmp/scanners/gitleaks dir . --redact=100 --config .gitleaks.toml
      - run: /tmp/scanners/gitleaks git . --redact=100 --config .gitleaks.toml

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: gh release download cargo-audit/v0.22.2 --repo RustSec/rustsec --pattern cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz --dir /tmp/scanners
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/cargo-audit.sha256"
        working-directory: /tmp/scanners
      - run: tar -xzf /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -C /tmp/scanners
      - run: /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit audit --deny warnings

  # Only main pushes may reuse authenticated full proof for the exact queue SHA.
  # Any lookup/setup/download/admission failure selects ordinary full preparation.
  verify-queue-receipt:
    needs: [secrets, dependencies]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      reused: ${{ steps.admit.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64 --dir /tmp/day2-bazel-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-queue-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-queue-receipt-${{ github.sha }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-queue-receipt-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier with Bazel
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: build-out/bin/xtask bootstrap
      - id: find
        run: build-out/bin/xtask verify-queue-find
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download workflow artifacts
        id: artifact_download_1
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ steps.find.outputs.artifact != '' }}
        with:
          artifact-ids: ${{ steps.find.outputs.artifact }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          repository: clankernative/platform
          path: /tmp/day2-merge-receipt
          merge-multiple: true
      - name: Retry download of workflow artifacts
        if: ${{ !cancelled() && steps.artifact_download_1.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.find.outputs.artifact }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          repository: clankernative/platform
          path: /tmp/day2-merge-receipt
          merge-multiple: true
      - id: admit
        if: ${{ steps.find.outputs.artifact != '' }}
        run: build-out/bin/xtask verify-queue-admit
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.admit.outputs.reused == 'true' }}
        with:
          name: day2-merge-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-merge-reuse.json
          if-no-files-found: error
          retention-days: 14

  verify-prepare-parts:
    # Reject known security failures before allocating compilation runners.
    needs: [secrets, dependencies, verify-queue-receipt]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [inputs, tests]
    env:
      # Do not compile the largest test targets concurrently inside 6 GiB.
      # Partition optimized tests into smaller LLVM units without local LTO.
      # Keep debug assertions and the complete runtime campaigns inside 6 GiB.
      # Preserve compiler statistics through the long runtime campaigns.
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64 --dir /tmp/day2-bazel-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-${{ github.sha }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier with Bazel
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - name: Install the browser test runtime
        if: ${{ matrix.part == 'inputs' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: build-out/bin/xtask verify-linux-context
      - name: Retain current native Linux preparation context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-context-preparation-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      # Cross-run build outputs have their own source-bound namespace. Native
      # guards re-admit them; no step or runtime receipt is selected by cache-hit.
      # Split restore/save so hashFiles runs only before builds modify these trees,
      # never in a post-job hook over generated files or sandbox-owned paths.
      - name: Restore completed fixture builds
        id: fixture_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ matrix.part == 'inputs' }}
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          key: day2-fixtures-v3-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**', 'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-${{ hashFiles('cli/**', 'fixtures/**', 'examples/**') }}
          restore-keys: |
            day2-fixtures-v3-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**', 'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-
          path: |
            artifacts/all-verification-cache.json
            artifacts/????????????????????????????????????????????????????????????????
      - name: Restore completed test executables
        id: test_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ matrix.part == 'tests' }}
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          key: day2-test-outputs-v2-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**', 'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**', 'cli/**', 'fixtures/**', 'examples/**') }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-programs
            build-out/tests/*
      - run: build-out/bin/xtask source-check
      - run: build-out/bin/xtask notices
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
      - name: Restore pinned native compiler and formatter inputs
        id: native_tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ matrix.part == 'inputs' }}
        with:
          path: /__w/${{ github.event.repository.name }}/.toolchains
          key: day2-native-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'toolchains/**', 'tools/**', 'crates/xtask/src/native_toolchain.rs', 'crates/xtask/src/main.rs', 'crates/xtask/src/formatting.rs', 'crates/xtask/src/formatter_bootstrap.rs') }}
      - run: build-out/bin/xtask bootstrap
      - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - name: Save pinned native compiler and formatter inputs
        if: ${{ matrix.part == 'inputs' && steps.native_tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /__w/${{ github.event.repository.name }}/.toolchains
          key: ${{ steps.native_tools.outputs.cache-primary-key }}
      - run: build-out/bin/xtask configure-tofu
      - run: build-out/bin/xtask verify-prepare-part ${{ matrix.part }}
        id: native_preparation
      - name: Retain current compiler failure metadata without private stdout
        if: ${{ failure() && steps.native_preparation.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-compiler-failure-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          # stdout.bin is a private, job-local spool; it is never uploaded.
          path: artifacts/bazel/failures/*/outcome.json
          # A preparation failure outside Bazel may have no compiler capture.
          if-no-files-found: warn
          retention-days: 3
      - name: Retain fixture compiler input identity and inventory
        if: ${{ matrix.part == 'inputs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-fixture-cache-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/all-verification-cache.json
            artifacts/bazel-compiler-inputs.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiled test input identity and inventory
        if: ${{ matrix.part == 'tests' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-compiled-test-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-binaries.json
          if-no-files-found: error
          retention-days: 14
      # Archive only this verifier's executable bytes.
      - name: Archive the current run verifier only
        if: ${{ matrix.part == 'inputs' }}
        run: tar -czf /tmp/day2-linux-verifier.tgz -C "$GITHUB_WORKSPACE" build-out/bin/xtask
      - name: Retain the current run verifier only
        if: ${{ matrix.part == 'inputs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-linux-verifier.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      # Each lane transports only its reviewed outputs. The test lane cannot
      # overwrite fixture caches, CLI distribution or generated worker sources.
      - name: Plan only this lane's admitted compiler outputs
        run: build-out/bin/xtask verify-transport-plan ${{ matrix.part }}
      - name: Archive fixture and check preparation
        if: ${{ matrix.part == 'inputs' }}
        run: tar -czf /tmp/day2-preparation.tgz -C "$GITHUB_WORKSPACE" --no-recursion --null -T /tmp/day2-verification-transport/inputs.list0
      - name: Archive test compilation and documentation preparation
        if: ${{ matrix.part == 'tests' }}
        run: tar -czf /tmp/day2-preparation.tgz -C "$GITHUB_WORKSPACE" --no-recursion --null -T /tmp/day2-verification-transport/tests.list0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-preparation-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Save completed fixture builds
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ matrix.part == 'inputs' && steps.fixture_cache.outputs.cache-hit != 'true' }}
        with:
          key: ${{ steps.fixture_cache.outputs.cache-primary-key }}
          path: |
            artifacts/all-verification-cache.json
            artifacts/????????????????????????????????????????????????????????????????
      - name: Save completed test executables
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ matrix.part == 'tests' && steps.test_cache.outputs.cache-hit != 'true' }}
        with:
          key: ${{ steps.test_cache.outputs.cache-primary-key }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-programs
            build-out/tests/*

      - name: Persist newly compiled actions under the captured source key
        if: ${{ !cancelled() && steps.bazel_actions.outputs.cache-primary-key != '' && steps.bazel_actions.outputs.cache-hit != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/'))) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.bazel_actions.outputs.cache-primary-key }}

  verify-mac-compatibility:
    # Reject known security failures before allocating compilation runners.
    needs: [secrets, dependencies, verify-queue-receipt]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      # Keep compilation parallelism within the standard Mac runner's CPU budget.
      # Preserve compiler statistics through the long runtime campaigns.
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64 --dir /tmp/day2-bazel-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
