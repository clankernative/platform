name: Platform CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      verification:
        description: Complete Linux release verification, or independent diagnostics
        type: choice
        options: [sharded, diagnostics]
        default: sharded
      compilation_cache:
        description: Reuse admitted compiled outputs, or measure complete verification with empty compiled-output caches
        type: choice
        options: [reuse, empty]
        default: reuse

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download pinned gitleaks_8.30.1_linux_x64.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: gitleaks/gitleaks
          tag: v8.30.1
          asset: gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          path: /tmp/scanners/gitleaks_8.30.1_linux_x64.tar.gz
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/gitleaks.sha256"
        working-directory: /tmp/scanners
      - run: tar -xzf /tmp/scanners/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/scanners
      - run: /tmp/scanners/gitleaks dir . --redact=100 --config .gitleaks.toml
      - run: /tmp/scanners/gitleaks git . --redact=100 --config .gitleaks.toml

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download pinned cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: RustSec/rustsec
          tag: cargo-audit/v0.22.2
          asset: cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          sha256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
          path: /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/cargo-audit.sha256"
        working-directory: /tmp/scanners
      - run: tar -xzf /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -C /tmp/scanners
      - run: /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit audit --deny warnings

  # Only main pushes may reuse authenticated Linux proof for the exact queue SHA.
  # Any lookup/setup/download/admission failure selects ordinary full preparation.
  verify-queue-receipt:
    needs: [secrets, dependencies]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      reused: ${{ steps.admit.outputs.reused }}
      cache_run: ${{ steps.admit.outputs.run }}
      cache_attempt: ${{ steps.admit.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the single-job Rust codegen jobserver
        run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: bazelbuild/bazel
          tag: 9.3.0
          asset: bazel-9.3.0-linux-x86_64
          sha256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          path: /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore checksum-addressed Bazel source downloads
        continue-on-error: true
        timeout-minutes: 3
        id: bazel_repositories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: day2-bazel-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-queue-receipt-${{ github.sha }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-queue-receipt-${{ github.sha }}
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-queue-receipt-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier with Bazel
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      # Main already compiles this verifier even when queue proof is reused.
      # Publish its completed actions in the default-branch scope for later PRs.
      - name: Publish completed Linux bootstrap actions
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.bazel_actions.outputs.cache-primary-key }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download pinned roc_nightly-linux_x86_64-2026-10-13-b17d287.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/nightlies
          tag: nightly-2026-10-13-b17d287
          asset: roc_nightly-linux_x86_64-2026-10-13-b17d287.tar.gz
          sha256: 3b613b155be6ea04c9a1ae4e315fb4cf911e2d0b7096708d07ef147647da578b
          path: .cache/day2-release/3b613b155be6ea04c9a1ae4e315fb4cf911e2d0b7096708d07ef147647da578b
      - name: Download pinned Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/basic-cli
          tag: 0.26.0-rc2
          asset: Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst
          sha256: 5778e6dc0354d5e7fb5b0725eff8e04da3c8d656049c63b43e3cc275ebefaf8b
          path: .cache/day2-release/5778e6dc0354d5e7fb5b0725eff8e04da3c8d656049c63b43e3cc275ebefaf8b
      - name: Download pinned 6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/http
          tag: 1.0.0
          asset: 6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst
          sha256: e9efaa950e72f6f76cdf6eaf00424572fa69b04ba612732357ac0453678f02b4
          path: .cache/day2-release/e9efaa950e72f6f76cdf6eaf00424572fa69b04ba612732357ac0453678f02b4
      - name: Download pinned clanker-ui-native-0.2.2-linux-x86_64.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: clankernative/clanker-ui
          tag: v0.2.2
          asset: clanker-ui-native-0.2.2-linux-x86_64.tar.gz
          sha256: 023482d8cb809621149ee9a67990bc999323082130d368fc49e8810909d9229e
          path: .cache/day2-release/023482d8cb809621149ee9a67990bc999323082130d368fc49e8810909d9229e
      - run: build-out/bin/xtask bootstrap
      - id: find
        run: build-out/bin/xtask verify-queue-find
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download workflow artifacts
        id: artifact_download_1
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.find.outputs.artifact != '' }}
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.find.outputs.artifact }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          repository: clankernative/platform
          path: /tmp/day2-merge-receipt
          merge-multiple: true
      - name: Retry download of workflow artifacts
        if: ${{ !cancelled() && steps.artifact_download_1.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.find.outputs.artifact }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          repository: clankernative/platform
          path: /tmp/day2-merge-receipt
          merge-multiple: true
      - id: admit
        if: ${{ steps.find.outputs.artifact != '' }}
        run: build-out/bin/xtask verify-queue-admit
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.admit.outputs.reused == 'true' }}
        with:
          archive: true
          name: day2-merge-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-merge-reuse.json
          if-no-files-found: error
          retention-days: 14

  verify-prepare-parts:
    # Reject known security failures before allocating compilation runners.
    needs: [secrets, dependencies, verify-queue-receipt]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=${{ matrix.part == 'tests' && '8g' || '6g' }} --memory-swap=${{ matrix.part == 'tests' && '8g' || '6g' }} --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [inputs, fixtures, tests]
    env:
      # Do not compile the largest test targets concurrently inside the selected fixed compiler allowance.
      # Partition optimized tests into smaller LLVM units without local LTO.
      # Keep debug assertions and the complete runtime campaigns inside the selected fixed compiler allowance.
      # Preserve compiler statistics through the long runtime campaigns.
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the single-job Rust codegen jobserver
        run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: bazelbuild/bazel
          tag: 9.3.0
          asset: bazel-9.3.0-linux-x86_64
          sha256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          path: /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore checksum-addressed Bazel source downloads
        continue-on-error: true
        timeout-minutes: 3
        id: bazel_repositories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: day2-bazel-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-${{ github.sha }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-${{ github.sha }}
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier with Bazel
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      # Capture the freshly used bootstrap actions before test compilation grows
      # and collects the disk cache. This is compiler data, never a test receipt.
      - name: Archive current verifier bootstrap compiler actions
        if: ${{ matrix.part == 'tests' }}
        id: bootstrap_actions_archive
        continue-on-error: true
        timeout-minutes: 3
        run: tar -I 'gzip -1' -cf /tmp/day2-bazel-linux-bootstrap-actions.tgz -C "$HOME/.cache/bazel-disk" .
      - name: Retain current verifier bootstrap compiler actions
        if: ${{ matrix.part == 'tests' && steps.bootstrap_actions_archive.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # A rerun keeps its checkout SHA and run ID. Preserve the first complete
          # snapshot if the producer is skipped or retried on a later attempt.
          name: day2-bazel-linux-bootstrap-actions-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/day2-bazel-linux-bootstrap-actions.tgz
          overwrite: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download the pinned OpenTofu archive
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: opentofu/opentofu
          tag: v1.11.5
          asset: tofu_1.11.5_linux_amd64.zip
          sha256: 901121681e751574d739de5208cad059eddf9bd739b575745cf9e3c961b28a13
          path: /tmp/day2-opentofu/tofu.zip
      - name: Install the pinned OpenTofu CLI
        timeout-minutes: 4
        run: |
          echo '901121681e751574d739de5208cad059eddf9bd739b575745cf9e3c961b28a13  /tmp/day2-opentofu/tofu.zip' | sha256sum --check
          unzip -j -o /tmp/day2-opentofu/tofu.zip tofu -d /tmp/day2-opentofu/bin
          chmod 0555 /tmp/day2-opentofu/bin/tofu
          echo /tmp/day2-opentofu/bin >> "$GITHUB_PATH"
      - name: Download pinned temporal_cli_1.6.1_linux_amd64.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: temporalio/cli
          tag: v1.6.1
          asset: temporal_cli_1.6.1_linux_amd64.tar.gz
          sha256: 85cfd2134eff7408e9e363f71a50f6d91f5df5f72eafa9eb87102d3793904faf
          path: /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - name: Install the browser test runtime
        if: ${{ matrix.part == 'inputs' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: build-out/bin/xtask verify-linux-context ${{ matrix.part == 'tests' && 'test-preparation' || 'standard' }}
      - name: Retain current native Linux preparation context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-linux-context-preparation-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      # Cross-run build outputs have their own source-bound namespace. Native
      # guards re-admit them; no step or runtime receipt is selected by cache-hit.
      # Split restore/save so hashFiles runs only before builds modify these trees,
      # never in a post-job hook over generated files or sandbox-owned paths.
      - name: Restore completed fixture builds
        id: fixture_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.part != 'tests' }}
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          key: day2-fixtures-v4-bazel-${{ matrix.part }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**', 'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', '.github/workflows/mac-compatibility.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-${{ hashFiles('cli/**', 'fixtures/**', 'examples/**') }}
          restore-keys: |
            day2-fixtures-v4-bazel-${{ matrix.part }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**', 'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', '.github/workflows/mac-compatibility.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-
          path: |
            artifacts/all-verification-cache.json
            artifacts/????????????????????????????????????????????????????????????????
      - name: Restore completed test executables
        id: test_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.part == 'tests' }}
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
