          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-${{ github.sha }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled actions from this run preparation only
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require security checks and complete verification
        run: test "$SECRETS:$DEPENDENCIES:$REUSED" = success:success:true -o "$SECRETS:$DEPENDENCIES:$PREPARATION:$SHARDS:$MAC" = success:success:success:success:success
        env:
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          REUSED: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
          PREPARATION: ${{ needs.verify-prepare.result }}
          SHARDS: ${{ needs.verify-shards.result }}
          MAC: ${{ needs.verify-mac-compatibility.result }}
      - name: Download day2-linux-verifier-${{ github.run_id }}-${{ github.run_attempt }}
