        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-preparation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-inputs
      - name: Retry download of day2-preparation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_2.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-preparation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-inputs
      - name: Download day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
        id: artifact_download_3
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-tests
      - name: Retry download of day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_3.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
