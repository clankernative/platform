  cleanup-linux-caches:
    # Plans are read-only. Only this main-only job may delete, after the new
    # shared compiler cache has actually been published. Cache failures are
    # acceleration warnings and never change the required verification gate.
    needs: [verify, publish-linux-actions]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.publish-linux-actions.outputs.published == 'true' && needs.verify.outputs.cache_count != '' && needs.verify.outputs.cache_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.verify.outputs.cache_matrix || '{"include":[{"id":0}]}') }}
    steps:
      - name: Require the newly published shared compiler cache
        # cache/save may warn and exit successfully without storing an entry.
        # Check actual existence before every deletion, including after eviction.
        run: >-
          gh api --hostname github.com --method GET
          'repos/clankernative/platform/actions/caches?ref=refs/heads/main&key=day2-bazel-actions-v1-Linux-X64-verify-prepare-parts-tests-${{ github.sha }}&per_page=100'
          --jq 'if any(.actions_caches[]; .key == "day2-bazel-actions-v1-Linux-X64-verify-prepare-parts-tests-${{ github.sha }}" and .ref == "refs/heads/main") then true else error("shared compiler cache not published; cleanup refused") end'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete one planned obsolete cache
        continue-on-error: true
        run: gh api --hostname github.com --method DELETE repos/clankernative/platform/actions/caches/${{ matrix.id }}
        env:
          GH_TOKEN: ${{ github.token }}

  verification-diagnostics:
    if: ${{ inputs.verification == 'diagnostics' }}
