---
name: Temporary restore Linux test memory
'on':
  workflow_dispatch:
    inputs:
      compilation_cache:
        description: Reuse input-keyed actions or restore none; whole test executable restores stay disabled
        type: choice
        options:
        - empty
        - reuse
        default: empty
permissions:
  contents: read
concurrency:
  group: restore-memory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - run: gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz
        --dir /tmp/scanners
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: sha256sum --check "$GITHUB_WORKSPACE/.github/gitleaks.sha256"
      working-directory: "/tmp/scanners"
    - run: tar -xzf /tmp/scanners/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/scanners
    - run: "/tmp/scanners/gitleaks dir . --redact=100 --config .gitleaks.toml"
    - run: "/tmp/scanners/gitleaks git . --redact=100 --config .gitleaks.toml"
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: gh release download cargo-audit/v0.22.2 --repo RustSec/rustsec --pattern
        cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz --dir /tmp/scanners
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: sha256sum --check "$GITHUB_WORKSPACE/.github/cargo-audit.sha256"
      working-directory: "/tmp/scanners"
    - run: tar -xzf /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
        -C /tmp/scanners
    - run: "/tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
        audit --deny warnings"
  verify-prepare-parts:
    needs:
    - secrets
    - dependencies
    if: "${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result
      == 'success' }}"
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      options: "--memory=${{ matrix.part == 'tests' && '8g' || '6g' }} --memory-swap=${{ matrix.part == 'tests' && '8g' || '6g' }} --cpus=4 --pids-limit=512 --cgroupns=private
        --cap-add=SYS_ADMIN --security-opt apparmor=unconfined"
      volumes:
      - "/usr/bin/gh:/usr/local/bin/gh:ro"
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part:
        - tests
    env:
      DAY2_TEMPORAL_CLI: "/tmp/day2-tools/temporal"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Compile the numeric-only memory observer
      run: rustc --edition=2024 -Copt-level=0 .github/diagnostics/compile_memory.rs
        -o /tmp/day2-compile-memory
    - name: Create the single-job Rust codegen jobserver
      run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
    - name: Download the pinned Linux Bazel executable
      if: "${{ runner.os == 'Linux' }}"
      run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64
        --dir /tmp/day2-bazel-tools
      env:
        GH_TOKEN: "${{ github.token }}"
    - name: Verify the pinned Linux Bazel bytes
      if: "${{ runner.os == 'Linux' }}"
      run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64'
        | sha256sum --check
    - name: Install the pinned Linux Bazel executable
      if: "${{ runner.os == 'Linux' }}"
      run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
    - name: Restore Bazel compilation and repository caches
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
      with:
        bazelisk-cache: true
        repository-cache: true
        disk-cache: false
        cache-save: "${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'merge_group' || (github.event_name == 'pull_request'
          && startsWith(github.ref, 'refs/pull/')) }}"
    - name: Restore source-keyed compiled actions
      id: bazel_actions
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        lookup-only: "${{ inputs.compilation_cache == 'empty' }}"
        path: "~/.cache/bazel-disk"
        key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{
          matrix.part }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: |
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-${{ github.sha }}-
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Compile and install the current verifier with Bazel
      run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor"
        run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"
        //crates/xtask:xtask -- install-verifier
    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
      with:
        tofu_version: 1.11.5
        tofu_wrapper: false
    - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz
        --dir /tmp/day2-tools
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
      working-directory: "/tmp/day2-tools"
    - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
    - name: Install the browser test runtime
      if: "${{ matrix.part == 'inputs' }}"
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.3
    - name: Establish the mandatory bounded native Linux compiler context
      id: linux_context
      run: build-out/bin/xtask verify-linux-context test-preparation
    - name: Retain current native Linux preparation context
      if: "${{ always() && steps.linux_context.outcome == 'success' }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: day2-linux-context-preparation-${{ matrix.part }}-${{ github.run_id
          }}-${{ github.run_attempt }}
        path: "/tmp/day2-ci-linux-context.json"
        if-no-files-found: error
        retention-days: 14
    - name: Restore completed fixture builds
      id: fixture_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: "${{ matrix.part != 'tests' }}"
      with:
        lookup-only: "${{ inputs.compilation_cache == 'empty' }}"
        key: day2-fixtures-v4-bazel-${{ matrix.part }}-${{ runner.os }}-${{ runner.arch
          }}-${{ hashFiles('.bazelversion', '.bazelrc', 'BUILD.bazel', 'MODULE.bazel',
          'MODULE.bazel.lock', 'build/bazel/**', 'Cargo.toml', 'Cargo.lock', 'build-dependencies/**',
          '.dockerignore', 'rust-toolchain.toml', 'toolchain.json', 'architecture*.json',
          'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**',
          'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**',
          'sdk/**') }}-${{ hashFiles('cli/**', 'fixtures/**', 'examples/**') }}
        restore-keys: 'day2-fixtures-v4-bazel-${{ matrix.part }}-${{ runner.os }}-${{
          runner.arch }}-${{ hashFiles(''.bazelversion'', ''.bazelrc'', ''BUILD.bazel'',
          ''MODULE.bazel'', ''MODULE.bazel.lock'', ''build/bazel/**'', ''Cargo.toml'',
          ''Cargo.lock'', ''build-dependencies/**'', ''.dockerignore'', ''rust-toolchain.toml'',
          ''toolchain.json'', ''architecture*.json'', ''architecture/**'', ''.github/workflows/ci.yml'',
          ''crates/**'', ''tools/**'', ''vendor/**'', ''assets/**'', ''ops/**'', ''infra/**'',
          ''deploy/**'', ''toolchains/**'', ''sdk/**'') }}-

'
        path: |
          artifacts/all-verification-cache.json
          artifacts/????????????????????????????????????????????????????????????????
    - name: Restore completed test executables
      id: test_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: "${{ matrix.part == 'tests' }}"
      with:
        lookup-only: true
        key: day2-test-outputs-v2-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion',
          '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**',
          'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml',
          'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml',
          'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**',
          'deploy/**', 'toolchains/**', 'sdk/**', 'cli/**', 'fixtures/**', 'examples/**')
          }}
        path: |
          artifacts/ci-test-build-cache.json
          artifacts/ci-test-programs
          build-out/tests/*
    - run: build-out/bin/xtask source-check
    - run: build-out/bin/xtask notices
    - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
    - name: Restore pinned native compiler and formatter inputs
      id: native_tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: "${{ matrix.part != 'tests' }}"
      with:
        path: "/__w/${{ github.event.repository.name }}/.toolchains"
        key: day2-native-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json',
          'toolchains/**', 'tools/**', 'crates/xtask/src/native_toolchain.rs', 'crates/xtask/src/main.rs',
          'crates/xtask/src/formatting.rs', 'crates/xtask/src/formatter_bootstrap.rs')
          }}
    - run: build-out/bin/xtask bootstrap
    - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform
        --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
    - name: Save pinned native compiler and formatter inputs
      if: "${{ matrix.part != 'tests' && steps.native_tools.outputs.cache-hit != 'true'
        }}"
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: "/__w/${{ github.event.repository.name }}/.toolchains"
        key: "${{ steps.native_tools.outputs.cache-primary-key }}"
    - run: build-out/bin/xtask configure-tofu
    - name: Check current formatting
      run: build-out/bin/xtask fmt-check
    - name: Check current architecture and exact native-site registrations
      run: build-out/bin/xtask architecture-check
    - name: Observe complete test compilation and documentation preparation
      run: "/tmp/day2-compile-memory"
      id: native_preparation
    - name: Check fixed preparation and standard context refusal controls
      run: build-out/bin/xtask test-rust //crates/xtask:unit_xtask --exact verification::tests::linux_context_requires_private_finite_native_compiler_limits --nocapture
      id: context_controls
    - name: List current heavy harness cases
      run: build-out/bin/xtask test-rust //crates/day2:unit_lib --list
      id: case_catalog
    - name: List ignored cases from the current heavy harness
      run: build-out/bin/xtask test-rust //crates/day2:unit_lib --list --ignored
      id: ignored_catalog
    - name: Retain current compiler failure metadata without private stdout
      if: "${{ failure() && (steps.case_catalog.outcome == 'failure' || steps.context_controls.outcome == 'failure' || steps.ignored_catalog.outcome == 'failure' || steps.native_preparation.outcome == 'failure') }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: day2-compiler-failure-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: artifacts/bazel/failures/*/outcome.json
        if-no-files-found: warn
        retention-days: 3
    - name: Retain fixture compiler input identity and inventory
      if: "${{ matrix.part != 'tests' }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: day2-fixture-cache-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: |
          artifacts/all-verification-cache.json
          artifacts/bazel-compiler-inputs.json
        if-no-files-found: error
        retention-days: 14
    - name: Retain compiled test input identity and inventory
      if: "${{ matrix.part == 'tests' }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: day2-compiled-test-inputs-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: |
          artifacts/ci-test-build-cache.json
          artifacts/ci-test-binaries.json
          artifacts/ci-preparation-tests.json
        if-no-files-found: error
        retention-days: 14
    - name: Plan only this lane's admitted compiler outputs
      run: build-out/bin/xtask verify-transport-plan ${{ matrix.part }}
    - name: Archive fixture and check preparation
      if: "${{ matrix.part != 'tests' }}"
      run: tar -czf /tmp/day2-preparation.tgz -C "$GITHUB_WORKSPACE" --no-recursion
        --null -T /tmp/day2-verification-transport/${{ matrix.part }}.list0
    - name: Archive test compilation and documentation preparation
      if: "${{ matrix.part == 'tests' }}"
      run: tar -czf /tmp/day2-preparation.tgz -C "$GITHUB_WORKSPACE" --no-recursion
        --null -T /tmp/day2-verification-transport/tests.list0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: day2-preparation-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: "/tmp/day2-preparation.tgz"
        if-no-files-found: error
        compression-level: 0
        retention-days: 3
    - name: Save completed fixture builds
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: "${{ matrix.part != 'tests' && steps.fixture_cache.outputs.cache-hit !=
        'true' }}"
      with:
        key: "${{ steps.fixture_cache.outputs.cache-primary-key }}"
        path: |
          artifacts/all-verification-cache.json
          artifacts/????????????????????????????????????????????????????????????????
    - name: Save completed test executables
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: "${{ matrix.part == 'tests' && steps.test_cache.outputs.cache-hit != 'true'
        }}"
      with:
        key: "${{ steps.test_cache.outputs.cache-primary-key }}"
        path: |
          artifacts/ci-test-build-cache.json
          artifacts/ci-test-programs
          build-out/tests/*
    - name: Persist newly compiled actions under the captured source key
      if: "${{ matrix.part != 'fixtures' && !cancelled() && steps.bazel_actions.outputs.cache-primary-key
        != '' && steps.bazel_actions.outputs.cache-hit != 'true' && ((github.event_name
        == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request'
        && startsWith(github.ref, 'refs/pull/'))) }}"
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: "~/.cache/bazel-disk"
        key: "${{ steps.bazel_actions.outputs.cache-primary-key }}"
    - name: Archive completed Linux test compiler actions
      if: "${{ matrix.part == 'tests' }}"
      continue-on-error: true
      timeout-minutes: 3
      id: linux_actions_archive
      run: tar -czf /tmp/day2-bazel-linux-actions.tgz -C "$HOME/.cache/bazel-disk"
        .
    - name: Retain Linux compiler actions for trusted main publication
      if: "${{ matrix.part == 'tests' && steps.linux_actions_archive.outcome == 'success'
        }}"
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: day2-bazel-linux-actions-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: "/tmp/day2-bazel-linux-actions.tgz"
        if-no-files-found: error
        compression-level: 0
        retention-days: 3
    - name: Retain numeric process and cgroup observations
      if: "${{ always() }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        archive: true
        name: linux-test-memory-${{ github.run_id }}-${{ github.run_attempt }}
        path: "/tmp/day2-compile-memory.jsonl"
        if-no-files-found: warn
        retention-days: 3
