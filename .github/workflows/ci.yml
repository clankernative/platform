name: Platform CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      verification:
        description: Complete Linux and focused Mac verification, or independent diagnostics
        type: choice
        options: [sharded, diagnostics]
        default: sharded

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir /tmp/scanners
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/gitleaks.sha256"
        working-directory: /tmp/scanners
      - run: tar -xzf /tmp/scanners/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/scanners
      - run: /tmp/scanners/gitleaks dir . --redact=100 --config .gitleaks.toml
      - run: /tmp/scanners/gitleaks git . --redact=100 --config .gitleaks.toml

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: gh release download cargo-audit/v0.22.2 --repo RustSec/rustsec --pattern cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz --dir /tmp/scanners
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/cargo-audit.sha256"
        working-directory: /tmp/scanners
      - run: tar -xzf /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -C /tmp/scanners
      - run: /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit audit --deny warnings

  # Only main pushes may reuse authenticated full proof for the exact queue SHA.
  # Any lookup/setup/download/admission failure selects ordinary full preparation.
  verify-queue-receipt:
    needs: [secrets, dependencies]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      reused: ${{ steps.admit.outputs.reused }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: day2-platform-ci-linux-v1
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: rustup show active-toolchain
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: day2-platform-ci-linux-v1
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          save-if: 'false'
      - run: cargo run --locked -p xtask -- bootstrap
      - id: find
        run: cargo run --locked -p xtask -- verify-queue-find
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ steps.find.outputs.artifact != '' }}
        with:
          artifact-ids: ${{ steps.find.outputs.artifact }}
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          repository: clankernative/platform
          path: /tmp/day2-merge-receipt
          merge-multiple: true
      - id: admit
        if: ${{ steps.find.outputs.artifact != '' }}
        run: cargo run --locked -p xtask -- verify-queue-admit
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.admit.outputs.reused == 'true' }}
        with:
          name: day2-merge-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-merge-reuse.json
          if-no-files-found: error
          retention-days: 14

  verify-prepare-parts:
    # Reject known security failures before allocating compilation runners.
    needs: [secrets, dependencies, verify-queue-receipt]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [inputs, tests]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: day2-platform-ci-linux-v1
      # Preserve compiler statistics through the long runtime campaigns.
      SCCACHE_IDLE_TIMEOUT: '0'
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up the Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Restore Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: day2-platform-ci-linux-v1
          # The virtual root manifest owns the compilation profiles.
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
          save-if: ${{ matrix.part == 'inputs' }}
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: cargo run --locked -p xtask -- verify-linux-context
      - name: Retain current native Linux preparation context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-context-preparation-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      # Cross-run build outputs have their own source-bound namespace. Native
      # guards re-admit them; no step or runtime receipt is selected by cache-hit.
      - name: Restore completed fixture builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ matrix.part == 'inputs' }}
        with:
          key: day2-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', '.cargo/**', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-${{ hashFiles('cli/**', 'fixtures/**', 'examples/**') }}
          restore-keys: |
            day2-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', '.cargo/**', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-
          path: |
            artifacts/all-verification-cache.json
            artifacts/????????????????????????????????????????????????????????????????
      - name: Restore completed test executables
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ matrix.part == 'tests' }}
        with:
          key: day2-test-outputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', '.cargo/**', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**', 'cli/**', 'fixtures/**', 'examples/**') }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-programs
            target/debug/deps/*
            !target/debug/deps/*.rlib
            !target/debug/deps/*.rmeta
            !target/debug/deps/*.d
      - run: cargo run --locked -p xtask -- source-check
      - run: cargo fetch --locked
      - run: cargo run --locked -p xtask -- notices
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
      - run: cargo run --locked -p xtask -- bootstrap
      - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo run --locked -p xtask -- bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - run: cargo run --locked -p xtask -- configure-tofu
      - run: cargo run --locked -p xtask -- verify-prepare-part ${{ matrix.part }}
      - name: Retain fixture compiler input identity and inventory
        if: ${{ matrix.part == 'inputs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-fixture-cache-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/all-verification-cache.json
            target/debug/xtask.d
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiled test input identity and inventory
        if: ${{ matrix.part == 'tests' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-compiled-test-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-binaries.json
          if-no-files-found: error
          retention-days: 14
      # Each lane transports only its reviewed outputs. The test lane cannot
      # overwrite fixture caches, CLI distribution or generated worker sources.
      - name: Archive fixture and check preparation
        if: ${{ matrix.part == 'inputs' }}
        run: tar -czf /tmp/day2-preparation.tgz --exclude=platform/target/debug/incremental --exclude=platform/target/debug/build --exclude=platform/target/debug/.fingerprint --exclude='platform/target/debug/deps/*.rlib' --exclude='platform/target/debug/deps/*.rmeta' --exclude='platform/target/debug/deps/*.d' -C "$GITHUB_WORKSPACE/.." platform/target platform/artifacts platform/cli platform/crates/worker/generated .toolchains
      - name: Archive test compilation and documentation preparation
        if: ${{ matrix.part == 'tests' }}
        run: tar -czf /tmp/day2-preparation.tgz --exclude=platform/target/debug/incremental --exclude=platform/target/debug/build --exclude=platform/target/debug/.fingerprint --exclude='platform/target/debug/deps/*.rlib' --exclude='platform/target/debug/deps/*.rmeta' --exclude='platform/target/debug/deps/*.d' -C "$GITHUB_WORKSPACE/.." platform/target/debug platform/artifacts/ci-test-binaries.json platform/artifacts/ci-test-build-cache.json platform/artifacts/ci-preparation-tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-preparation-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify-mac-compatibility:
    # Reject known security failures before allocating compilation runners.
    needs: [secrets, dependencies, verify-queue-receipt]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: day2-platform-ci-v2
      # Preserve compiler statistics through the long runtime campaigns.
      SCCACHE_IDLE_TIMEOUT: '0'
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_darwin_arm64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: shasum -a 256 --check "$GITHUB_WORKSPACE/.github/temporal.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_darwin_arm64.tar.gz -C /tmp/day2-tools
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up the Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Restore Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: day2-platform-ci-v2
          # The virtual root manifest owns the compilation profiles.
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
      # Cross-run build outputs have their own source-bound namespace. Native
      # guards re-admit them; no step or runtime receipt is selected by cache-hit.
      - name: Restore completed fixture builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: day2-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', '.cargo/**', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-${{ hashFiles('cli/**', 'fixtures/**', 'examples/**') }}
          restore-keys: |
            day2-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', '.cargo/**', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**') }}-
          path: |
            artifacts/all-verification-cache.json
            artifacts/????????????????????????????????????????????????????????????????
      - name: Restore completed test executables
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: day2-test-outputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml', '.cargo/**', 'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml', 'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**', 'deploy/**', 'toolchains/**', 'sdk/**', 'cli/**', 'fixtures/**', 'examples/**') }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-programs
            target/debug/deps/*
            !target/debug/deps/*.rlib
            !target/debug/deps/*.rmeta
            !target/debug/deps/*.d
      - run: cargo run --locked -p xtask -- source-check
      - run: cargo fetch --locked
      - run: cargo run --locked -p xtask -- notices
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
      - run: cargo run --locked -p xtask -- bootstrap
      - run: gh release download roc-formatter-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-aarch64-apple-darwin --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo run --locked -p xtask -- bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-aarch64-apple-darwin
      - run: cargo run --locked -p xtask -- configure-tofu
      - run: cargo run --locked -p xtask -- verify-mac
      - name: Retain real Mac native preparation, exact cases and both build campaigns
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-mac-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-mac-compatibility.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the separate native Mac compiler inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-mac-compiler-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-test-build-cache.json
            artifacts/ci-test-binaries.json
            target/debug/xtask.d
          if-no-files-found: error
          retention-days: 14

  verify-prepare:
    needs: [secrets, dependencies, verify-queue-receipt, verify-prepare-parts]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the selected complete preparation pipeline
        run: test "$PARALLEL" = success
        env:
          PARALLEL: ${{ needs.verify-prepare-parts.result }}
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: day2-platform-ci-linux-v1
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          save-if: 'false'
      - run: cargo fetch --locked
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: cargo run --locked -p xtask -- verify-linux-context
      - name: Retain current native Linux preparation join context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-context-preparation-join-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-preparation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-tests
      - name: Restore fixture and check outputs
        run: tar -xzf /tmp/day2-preparation-inputs/day2-preparation.tgz -C "$GITHUB_WORKSPACE/.."
      - name: Restore test compilation outputs
        run: tar -xzf /tmp/day2-preparation-tests/day2-preparation.tgz -C "$GITHUB_WORKSPACE/.."
      - name: Admit both preparation parts
        run: target/debug/xtask verify-prepare-join
      - name: Archive complete admitted preparation
        run: tar -czf /tmp/day2-verification.tgz --exclude=platform/target/debug/incremental --exclude=platform/target/debug/build --exclude=platform/target/debug/.fingerprint --exclude='platform/target/debug/deps/*.rlib' --exclude='platform/target/debug/deps/*.rmeta' --exclude='platform/target/debug/deps/*.d' -C "$GITHUB_WORKSPACE/.." platform/target platform/artifacts platform/cli platform/crates/worker/generated .toolchains
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-verification.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify-shards:
    needs: verify-prepare
    if: ${{ !cancelled() && needs.verify-prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [workspace-day2, workspace-control, workspace-other, simulation, parallel-runtime]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: day2-platform-ci-linux-v1
      SCCACHE_IDLE_TIMEOUT: '0'
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - run: rustup show active-toolchain
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: day2-platform-ci-linux-v1
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          save-if: 'false'
      - run: cargo fetch --locked
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: cargo run --locked -p xtask -- verify-linux-context
      - name: Retain current native Linux shard context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-context-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-verification
      - run: tar -xzf /tmp/day2-verification/day2-verification.tgz -C "$GITHUB_WORKSPACE/.."
      - run: target/debug/xtask configure-tofu
      - run: target/debug/xtask verify-shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-result-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-results/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [secrets, dependencies, verify-queue-receipt, verify-prepare, verify-shards, verify-mac-compatibility]
    if: ${{ always() && inputs.verification != 'diagnostics' }}
    # A rejected source only needs the failure guard, not a macOS queue slot.
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: day2-platform-ci-linux-v1
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require security checks and complete verification
        run: test "$SECRETS:$DEPENDENCIES:$REUSED" = success:success:true -o "$SECRETS:$DEPENDENCIES:$PREPARATION:$SHARDS:$MAC" = success:success:success:success:success
        env:
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          REUSED: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
          PREPARATION: ${{ needs.verify-prepare.result }}
          SHARDS: ${{ needs.verify-shards.result }}
          MAC: ${{ needs.verify-mac-compatibility.result }}
      - run: rustup show active-toolchain
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          prefix-key: day2-platform-ci-linux-v1
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          save-if: 'false'
      - run: cargo fetch --locked
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: cargo run --locked -p xtask -- verify-linux-context
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - name: Retain current native Linux final context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-context-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          name: day2-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-verification
      - run: tar -xzf /tmp/day2-verification/day2-verification.tgz -C "$GITHUB_WORKSPACE/.."
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          pattern: day2-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-results
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          name: day2-mac-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - run: target/debug/xtask verify-compose
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          name: day2-verification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification.json
            artifacts/ci-verification.json
            artifacts/ci-prepared.json
            artifacts/ci-test-build-cache.json
            artifacts/ci-preparation-*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
        with:
          name: day2-merge-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Retain reused evidence with its original execution identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
        with:
          name: day2-reused-verification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-merge-reuse.json
          if-no-files-found: error
          retention-days: 14

  verification-diagnostics:
    needs: [secrets, dependencies]
    if: ${{ inputs.verification == 'diagnostics' && needs.secrets.result == 'success' && needs.dependencies.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: day2-platform-ci-linux-v1
      # Preserve compiler statistics through the long runtime campaigns.
      SCCACHE_IDLE_TIMEOUT: '0'
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up the Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Restore Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: day2-platform-ci-linux-v1
          # The virtual root manifest owns the compilation profiles.
          key: ${{ hashFiles('Cargo.toml') }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
          shared-key: ${{ hashFiles('Cargo.toml') }}-verify
          save-if: 'false'
      - name: Establish the unchanged bounded Linux context for startup controls
        id: startup_context
        run: cargo run --locked -p xtask -- verify-linux-context
      - name: Retain this diagnostic context before later failures
        if: ${{ always() && steps.startup_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-startup-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 3
      - run: cargo run --locked -p xtask -- source-check
      - run: cargo fetch --locked
      - run: cargo run --locked -p xtask -- notices
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
      - run: cargo run --locked -p xtask -- bootstrap
      - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo run --locked -p xtask -- bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - run: cargo run --locked -p xtask -- configure-tofu
      - run: cargo run --locked -p xtask -- fmt
      - run: git diff --binary > /tmp/day2-format.patch
      - run: target/debug/xtask architecture-inventory > /tmp/day2-architecture-inventory.json
      - run: target/debug/xtask architecture-dependencies > /tmp/day2-architecture-dependencies.json
      - run: target/debug/xtask architecture-proof-inventory > /tmp/day2-architecture-proofs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: day2-verification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/day2-format.patch
            /tmp/day2-architecture-inventory.json
            /tmp/day2-architecture-dependencies.json
            /tmp/day2-architecture-proofs.json
            target/debug/xtask.d
          if-no-files-found: error
          retention-days: 3
      - name: Require the exact current native, dependency and proof admission
        run: target/debug/xtask architecture-check
      - name: Require complete strict workspace and all-targets lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run real sandbox, compiler-driver and fixed-report controls
        run: cargo test --locked -p day2-sandbox --lib --bins --test isolation -- --nocapture
      - name: Run all current worker controls including a backlogged forged report
        run: cargo test --locked -p day2 --lib worker::tests -- --nocapture
      - name: Require the existing operator privacy control
        run: cargo test --locked -p day2 --lib error::tests::operator_diagnostics_retain_codes_without_context_or_payloads -- --exact --nocapture

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        stack: [cluster, app-edge, security-shell-edge, security-shell, day2-app, qualification-runner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/gke/stacks
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} validate
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} test

  gitea-integration-example:
    # Tests an opt-in provider example; it is not part of the core GKE apply order.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/integrations
      - run: tofu -chdir=deploy/integrations/gitea-instance-ci init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/integrations/gitea-instance-ci validate
      - run: tofu -chdir=deploy/integrations/gitea-instance-ci test

  firestore-epoch-integration-example:
    # Resource-only provider example; no credentials or live cloud operations.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/integrations/firestore-security-epoch
      - run: tofu -chdir=deploy/integrations/firestore-security-epoch init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/integrations/firestore-security-epoch validate
      - run: tofu -chdir=deploy/integrations/firestore-security-epoch test
