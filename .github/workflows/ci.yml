  publish-linux-actions:
    # Same trust boundary as the Mac publisher: an independently completed full
    # gate, or main's authenticated exact-commit merge-group proof. Cache absence
    # only loses acceleration; it never changes verification obligations.
    needs: [verify, verify-queue-receipt, verify-prepare-parts]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && (needs.verify-prepare-parts.result == 'success' || (needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' && needs.verify-queue-receipt.outputs.cache_run != '' && needs.verify-queue-receipt.outputs.cache_attempt != '')) }}
    runs-on: ubuntu-24.04
    # actions/cache archives paths relative to GITHUB_WORKSPACE. Match the
    # producer's container workspace/HOME layout, not the Ubuntu host layout.
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      options: --memory=1g --memory-swap=1g --cpus=2 --pids-limit=128
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      DAY2_CACHE_ORIGIN_RUN: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' && needs.verify-queue-receipt.outputs.cache_run || github.run_id }}
      DAY2_CACHE_ORIGIN_ATTEMPT: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' && needs.verify-queue-receipt.outputs.cache_attempt || github.run_attempt }}
    outputs:
      published: ${{ steps.actions_publish.outcome == 'success' }}
    steps:
      - name: Download compiler actions from the admitted origin
        id: actions_download
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ env.DAY2_CACHE_ORIGIN_RUN }}
          name: day2-bazel-linux-actions-${{ env.DAY2_CACHE_ORIGIN_RUN }}-${{ env.DAY2_CACHE_ORIGIN_ATTEMPT }}
          path: /tmp/day2-bazel-linux-actions
      - name: Retry compiler action download once
        id: actions_retry
        if: ${{ !cancelled() && steps.actions_download.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ env.DAY2_CACHE_ORIGIN_RUN }}
          name: day2-bazel-linux-actions-${{ env.DAY2_CACHE_ORIGIN_RUN }}-${{ env.DAY2_CACHE_ORIGIN_ATTEMPT }}
          path: /tmp/day2-bazel-linux-actions
      - name: Create the compiler cache directory
        if: ${{ steps.actions_download.outcome == 'success' || steps.actions_retry.outcome == 'success' }}
        continue-on-error: true
        id: actions_directory
        run: mkdir -p "$HOME/.cache/bazel-disk"
      - name: Restore only compiler action data
        id: actions_extract
        if: ${{ steps.actions_directory.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: tar -xzf /tmp/day2-bazel-linux-actions/day2-bazel-linux-actions.tgz -C "$HOME/.cache/bazel-disk"
      - name: Publish shared compiler actions on main
        id: actions_publish
        if: ${{ steps.actions_extract.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-${{ github.sha }}
      - name: Checkout current dependency keys for source-cache publication
        id: repository_checkout
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Source archives are untrusted acceleration data. Bazel still checks
      # each requested checksum; no compiler or verification receipt is reused.
      - name: Find this dependency key in the current branch scope
        id: repository_lookup
        if: ${{ !cancelled() && steps.repository_checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: ~/.cache/bazel-repo/content_addressable
          key: day2-bazel-downloads-v1-Linux-X64-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
      - name: Download source archives from the admitted origin
        id: repository_download
        if: ${{ !cancelled() && steps.repository_lookup.outputs.cache-primary-key != '' && steps.repository_lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ env.DAY2_CACHE_ORIGIN_RUN }}
          name: day2-bazel-source-downloads-Linux-X64-${{ env.DAY2_CACHE_ORIGIN_RUN }}-${{ env.DAY2_CACHE_ORIGIN_ATTEMPT }}
          path: ~/.cache/bazel-repo/content_addressable
      - name: Retry source archive download once
        id: repository_retry
        if: ${{ !cancelled() && steps.repository_download.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ env.DAY2_CACHE_ORIGIN_RUN }}
          name: day2-bazel-source-downloads-Linux-X64-${{ env.DAY2_CACHE_ORIGIN_RUN }}-${{ env.DAY2_CACHE_ORIGIN_ATTEMPT }}
          path: ~/.cache/bazel-repo/content_addressable
      - name: Publish source downloads in this branch scope
        if: ${{ !cancelled() && (steps.repository_download.outcome == 'success' || steps.repository_retry.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: ${{ steps.repository_lookup.outputs.cache-primary-key }}


  verify-prepare:
    needs: [secrets, dependencies, verify-queue-receipt, verify-prepare-parts]
    if: ${{ !cancelled() && needs.secrets.result == 'success' && needs.dependencies.result == 'success' && !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && inputs.verification != 'diagnostics' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      checks: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the single-job Rust codegen jobserver
        run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: bazelbuild/bazel
          tag: 9.3.0
          asset: bazel-9.3.0-linux-x86_64
          sha256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          path: /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore checksum-addressed Bazel source downloads
        continue-on-error: true
        timeout-minutes: 3
        id: bazel_repositories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: day2-bazel-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-${{ github.sha }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-${{ github.sha }}
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the selected complete preparation pipeline
        run: test "$PARALLEL" = success
        env:
          PARALLEL: ${{ needs.verify-prepare-parts.result }}
      # Cache-service eviction must not discard the compiler work retained by
      # this run's completed tests lane before the bounded admission join.
      - name: Download retained compiler actions for preparation admission
        id: preparation_actions_download
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: day2-bazel-linux-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-compiler-actions
      - name: Retry retained preparation compiler action download once
        id: preparation_actions_retry
        if: ${{ !cancelled() && steps.preparation_actions_download.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: day2-bazel-linux-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-preparation-compiler-actions
      - name: Create the preparation compiler cache directory
        id: preparation_actions_directory
        if: ${{ steps.preparation_actions_download.outcome == 'success' || steps.preparation_actions_retry.outcome == 'success' }}
        continue-on-error: true
        run: mkdir -p "$HOME/.cache/bazel-disk"
      - name: Restore retained compiler actions before preparation admission
        if: ${{ steps.preparation_actions_directory.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: tar -xzf /tmp/day2-preparation-compiler-actions/day2-bazel-linux-actions.tgz -C "$HOME/.cache/bazel-disk"
      - name: Bootstrap the current source artifact admission guard
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: build-out/bin/xtask verify-linux-context standard
      - name: Retain current native Linux preparation join context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-linux-context-preparation-join-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      - name: Select authenticated artifacts from successful producer attempts
        id: artifact_plan
        run: build-out/bin/xtask verify-artifact-plan preparation
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download day2-preparation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        id: artifact_download_2
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.inputs }}
          merge-multiple: true
          path: /tmp/day2-preparation-inputs
      - name: Retry download of day2-preparation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_2.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.inputs }}
          merge-multiple: true
          path: /tmp/day2-preparation-inputs
      - name: Download day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
        id: artifact_download_3
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.tests }}
          merge-multiple: true
          path: /tmp/day2-preparation-tests
      - name: Retry download of day2-preparation-tests-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_3.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.tests }}
          merge-multiple: true
          path: /tmp/day2-preparation-tests
      - name: Restore fixture and check outputs
        run: tar -xzf /tmp/day2-preparation-inputs/day2-preparation.tgz -C "$GITHUB_WORKSPACE"
      - name: Download the second fixture preparation part
        id: artifact_download_fixtures
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.fixtures }}
          merge-multiple: true
          path: /tmp/day2-preparation-fixtures
      - name: Retry download of the second fixture preparation part
        if: ${{ !cancelled() && steps.artifact_download_fixtures.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.fixtures }}
          merge-multiple: true
          path: /tmp/day2-preparation-fixtures
      - name: Restore the second fixture preparation outputs
        run: tar -xzf /tmp/day2-preparation-fixtures/day2-preparation.tgz -C "$GITHUB_WORKSPACE"
      - name: Restore test compilation outputs
        run: tar -xzf /tmp/day2-preparation-tests/day2-preparation.tgz -C "$GITHUB_WORKSPACE"
      - name: Restore pinned native compiler and formatter inputs
        id: native_tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /__w/${{ github.event.repository.name }}/.toolchains
          key: day2-native-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'toolchains/**', 'tools/**', 'crates/xtask/src/native_toolchain.rs', 'crates/xtask/src/main.rs', 'crates/xtask/src/formatting.rs', 'crates/xtask/src/formatter_bootstrap.rs') }}
      - name: Download pinned roc_nightly-linux_x86_64-2026-10-13-b17d287.tar.gz
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/nightlies
          tag: nightly-2026-10-13-b17d287
          asset: roc_nightly-linux_x86_64-2026-10-13-b17d287.tar.gz
          sha256: 3b613b155be6ea04c9a1ae4e315fb4cf911e2d0b7096708d07ef147647da578b
          path: .cache/day2-release/3b613b155be6ea04c9a1ae4e315fb4cf911e2d0b7096708d07ef147647da578b
      - name: Download pinned Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/basic-cli
          tag: 0.26.0-rc2
          asset: Gj3zVDr3qrQa6aTh7Z1zgUfe9NeBE6R76T5ho3xrc8af.tar.zst
          sha256: 5778e6dc0354d5e7fb5b0725eff8e04da3c8d656049c63b43e3cc275ebefaf8b
          path: .cache/day2-release/5778e6dc0354d5e7fb5b0725eff8e04da3c8d656049c63b43e3cc275ebefaf8b
      - name: Download pinned 6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: roc-lang/http
          tag: 1.0.0
          asset: 6ZUwqYhCS8PU9Mo6MF7oV82ET2o7KYb57CLKDq4cq4sS.tar.zst
          sha256: e9efaa950e72f6f76cdf6eaf00424572fa69b04ba612732357ac0453678f02b4
          path: .cache/day2-release/e9efaa950e72f6f76cdf6eaf00424572fa69b04ba612732357ac0453678f02b4
      - name: Download pinned clanker-ui-native-0.2.2-linux-x86_64.tar.gz
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: clankernative/clanker-ui
          tag: v0.2.2
          asset: clanker-ui-native-0.2.2-linux-x86_64.tar.gz
          sha256: 023482d8cb809621149ee9a67990bc999323082130d368fc49e8810909d9229e
          path: .cache/day2-release/023482d8cb809621149ee9a67990bc999323082130d368fc49e8810909d9229e
      - name: Download pinned compiler inputs on cache miss
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        run: build-out/bin/xtask bootstrap
      - name: Download pinned roc-fmt-day2-x86_64-unknown-linux-gnu
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: clankernative/platform
          tag: roc-formatter-linux-2026-09-12
          asset: roc-fmt-day2-x86_64-unknown-linux-gnu
          sha256: 4b4eed88a6540d041fc33fe5eecdbc43ee8fcfa4a549931bf4369e21fad49825
          path: /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - name: Admit pinned formatter input on cache miss
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
        run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - name: Admit all three preparation parts
        run: build-out/bin/xtask verify-prepare-join
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Plan shard-specific admitted compiler outputs
        run: build-out/bin/xtask verify-transport-plan runtime
      - name: Archive admitted common outputs
        run: tar -czf /tmp/day2-common.tgz -C "$GITHUB_WORKSPACE" --no-recursion --null -T /tmp/day2-verification-transport/common.list0
      - name: Retain admitted common outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-verify-common-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-common.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Archive admitted workspace-day2 outputs
        run: tar -czf /tmp/day2-workspace-day2.tgz -C "$GITHUB_WORKSPACE" --no-recursion --null -T /tmp/day2-verification-transport/workspace-day2.list0
      - name: Retain admitted workspace-day2 outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-verify-workspace-day2-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-workspace-day2.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Archive admitted workspace-control outputs
        run: tar -czf /tmp/day2-workspace-control.tgz -C "$GITHUB_WORKSPACE" --no-recursion --null -T /tmp/day2-verification-transport/workspace-control.list0
      - name: Retain admitted workspace-control outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-verify-workspace-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-workspace-control.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Archive admitted workspace-other outputs
        run: tar -czf /tmp/day2-workspace-other.tgz -C "$GITHUB_WORKSPACE" --no-recursion --null -T /tmp/day2-verification-transport/workspace-other.list0
      - name: Retain admitted workspace-other outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-verify-workspace-other-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-workspace-other.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain the exact transport file inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: day2-transport-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-verification-transport/plan.json
          if-no-files-found: error
          retention-days: 14

  verify-shards:
    needs: verify-prepare
    if: ${{ !cancelled() && needs.verify-prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      # Reap the temporary Clippy fixture servers when they shut down.
      options: --init --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      checks: read
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [workspace-day2, workspace-day2-runtime, workspace-control, workspace-other, simulation, parallel-runtime]
    env:
      DAY2_CACHE_ORIGIN_RUN: ${{ github.run_id }}
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the single-job Rust codegen jobserver
        run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: bazelbuild/bazel
          tag: 9.3.0
          asset: bazel-9.3.0-linux-x86_64
          sha256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          path: /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore checksum-addressed Bazel source downloads
        continue-on-error: true
        timeout-minutes: 3
        id: bazel_repositories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: day2-bazel-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-shards-${{ github.sha }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-shards-${{ github.sha }}
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-shards-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download the pinned OpenTofu archive
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: opentofu/opentofu
          tag: v1.11.5
          asset: tofu_1.11.5_linux_amd64.zip
          sha256: 901121681e751574d739de5208cad059eddf9bd739b575745cf9e3c961b28a13
          path: /tmp/day2-opentofu/tofu.zip
      - name: Install the pinned OpenTofu CLI
        timeout-minutes: 4
        run: |
          echo '901121681e751574d739de5208cad059eddf9bd739b575745cf9e3c961b28a13  /tmp/day2-opentofu/tofu.zip' | sha256sum --check
          unzip -j -o /tmp/day2-opentofu/tofu.zip tofu -d /tmp/day2-opentofu/bin
          chmod 0555 /tmp/day2-opentofu/bin/tofu
          echo /tmp/day2-opentofu/bin >> "$GITHUB_PATH"
      - name: Download pinned temporal_cli_1.6.1_linux_amd64.tar.gz
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: temporalio/cli
          tag: v1.6.1
          asset: temporal_cli_1.6.1_linux_amd64.tar.gz
          sha256: 85cfd2134eff7408e9e363f71a50f6d91f5df5f72eafa9eb87102d3793904faf
          path: /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - name: Download retained compiler actions from the admitted preparation
        id: bootstrap_actions_download
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ env.DAY2_CACHE_ORIGIN_RUN }}
          name: day2-bazel-linux-bootstrap-actions-${{ github.sha }}-${{ env.DAY2_CACHE_ORIGIN_RUN }}
          path: /tmp/day2-bazel-linux-bootstrap-actions
      - name: Retry retained compiler action download once
        id: bootstrap_actions_retry
        if: ${{ !cancelled() && steps.bootstrap_actions_download.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ env.DAY2_CACHE_ORIGIN_RUN }}
          name: day2-bazel-linux-bootstrap-actions-${{ github.sha }}-${{ env.DAY2_CACHE_ORIGIN_RUN }}
          path: /tmp/day2-bazel-linux-bootstrap-actions
      - name: Create the retained compiler cache directory
        id: bootstrap_actions_directory
        if: ${{ steps.bootstrap_actions_download.outcome == 'success' || steps.bootstrap_actions_retry.outcome == 'success' }}
        continue-on-error: true
        run: mkdir -p "$HOME/.cache/bazel-disk"
      - name: Restore retained compiler action data before admission bootstrap
        if: ${{ steps.bootstrap_actions_directory.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: tar -xzf /tmp/day2-bazel-linux-bootstrap-actions/day2-bazel-linux-bootstrap-actions.tgz -C "$HOME/.cache/bazel-disk"
      - name: Bootstrap the current source artifact admission guard
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: build-out/bin/xtask verify-linux-context standard
      - name: Select authenticated artifacts from successful producer attempts
        id: artifact_plan
        run: build-out/bin/xtask verify-artifact-plan ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download common admitted fixtures and metadata
        id: artifact_download_2
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.common }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Retry download of common admitted fixtures and metadata
        if: ${{ !cancelled() && steps.artifact_download_2.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.common }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Restore common admitted fixtures and metadata
        run: tar -xzf /tmp/day2-verification/day2-common.tgz -C "$GITHUB_WORKSPACE"
      - name: Download this workspace shard's test executables
        id: artifact_download_3
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ startsWith(matrix.shard, 'workspace-') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.binaries }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Retry download of this workspace shard's test executables
        if: ${{ !cancelled() && steps.artifact_download_3.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.binaries }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Restore this workspace shard's test executables
        if: ${{ startsWith(matrix.shard, 'workspace-') }}
        run: tar -xzf /tmp/day2-verification/day2-${{ matrix.shard == 'workspace-day2-runtime' && 'workspace-day2' || matrix.shard }}.tgz -C "$GITHUB_WORKSPACE"
      - name: Download all required binary groups in parallel
        id: artifact_download_4
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ matrix.shard == 'parallel-runtime' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.binaries }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Retry download of all required binary groups in parallel
        if: ${{ !cancelled() && steps.artifact_download_4.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
