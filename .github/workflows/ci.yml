      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-result-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-results/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [secrets, dependencies, verify-queue-receipt, verify-prepare, verify-shards, verify-mac-compatibility, retry-mac-compatibility]
    if: ${{ always() && inputs.verification != 'diagnostics' }}
    # A rejected source only needs the failure guard, not a macOS queue slot.
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      checks: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create the single-job Rust codegen jobserver
        run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64 --dir /tmp/day2-bazel-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-${{ github.sha }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled actions from this run preparation only
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require security checks and complete verification
        run: test "$SECRETS:$DEPENDENCIES:$REUSED" = success:success:true -o "$SECRETS:$DEPENDENCIES:$PREPARATION:$SHARDS:$MAC" = success:success:success:success:success
        env:
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          REUSED: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
          PREPARATION: ${{ needs.verify-prepare.result }}
          SHARDS: ${{ needs.verify-shards.result }}
          MAC: ${{ needs.verify-mac-compatibility.result == 'success' && 'success' || needs.retry-mac-compatibility.result }}
      - name: Bootstrap the current source artifact admission guard
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - name: Establish the mandatory bounded native Linux compiler context
        id: linux_context
        run: build-out/bin/xtask verify-linux-context
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - name: Retain current native Linux final context
        if: ${{ always() && steps.linux_context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linux-context-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-ci-linux-context.json
          if-no-files-found: error
          retention-days: 14
      - name: Select authenticated artifacts from successful producer attempts
        id: artifact_plan
        run: build-out/bin/xtask verify-artifact-plan ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' && 'reuse' || 'compose' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download common admitted fixtures and metadata
        id: artifact_download_2
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.common }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Retry download of common admitted fixtures and metadata
        if: ${{ !cancelled() && steps.artifact_download_2.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.common }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Restore common admitted fixtures and metadata
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        run: tar -xzf /tmp/day2-verification/day2-common.tgz -C "$GITHUB_WORKSPACE"
      - name: Download all required binary groups in parallel
        id: artifact_download_3
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.binaries }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Retry download of all required binary groups in parallel
        if: ${{ !cancelled() && steps.artifact_download_3.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.binaries }}
          merge-multiple: true
          path: /tmp/day2-verification
      - name: Restore required workspace-day2 test executables
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        run: tar -xzf /tmp/day2-verification/day2-workspace-day2.tgz -C "$GITHUB_WORKSPACE"
      - name: Restore required workspace-control test executables
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        run: tar -xzf /tmp/day2-verification/day2-workspace-control.tgz -C "$GITHUB_WORKSPACE"
      - name: Restore required workspace-other test executables
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        run: tar -xzf /tmp/day2-verification/day2-workspace-other.tgz -C "$GITHUB_WORKSPACE"
      - name: Download day2-result-*-${{ github.run_id }}-${{ github.run_attempt }}
        id: artifact_download_4
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.results }}
          merge-multiple: true
          path: artifacts/ci-results
      - name: Retry download of day2-result-*-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_4.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.results }}
          merge-multiple: true
          path: artifacts/ci-results
      - name: Download day2-mac-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
        id: artifact_download_5
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.mac }}
          merge-multiple: true
          path: artifacts
      - name: Retry download of day2-mac-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_5.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.mac }}
          merge-multiple: true
          path: artifacts
      - name: Restore pinned native compiler and formatter inputs
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        id: native_tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /__w/${{ github.event.repository.name }}/.toolchains
          key: day2-native-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'toolchains/**', 'tools/**', 'crates/xtask/src/native_toolchain.rs', 'crates/xtask/src/main.rs', 'crates/xtask/src/formatting.rs', 'crates/xtask/src/formatter_bootstrap.rs') }}
      - name: Download pinned compiler inputs on cache miss
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && steps.native_tools.outputs.cache-hit != 'true' }}
        run: build-out/bin/xtask bootstrap
      - name: Download pinned formatter input on cache miss
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && steps.native_tools.outputs.cache-hit != 'true' }}
        run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Admit pinned formatter input on cache miss
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') && steps.native_tools.outputs.cache-hit != 'true' }}
        run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - run: build-out/bin/xtask verify-compose
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !(needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true') }}
        with:
          name: day2-verification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification.json
            artifacts/ci-verification.json
            artifacts/ci-artifact-selection.json
            artifacts/ci-prepared.json
            artifacts/ci-test-build-cache.json
            artifacts/ci-preparation-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Download day2-merge-reuse-${{ github.run_id }}-${{ github.run_attempt }}
        id: artifact_download_6
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.reuse_artifact }}
          merge-multiple: true
          path: artifacts
      - name: Retry download of day2-merge-reuse-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_6.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: clankernative/platform
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ steps.artifact_plan.outputs.reuse_artifact }}
          merge-multiple: true
          path: artifacts
      - name: Retain reused evidence with its original execution identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.verify-queue-receipt.result == 'success' && needs.verify-queue-receipt.outputs.reused == 'true' }}
        with:
          name: day2-reused-verification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-merge-reuse.json
          if-no-files-found: error
          retention-days: 14

  verification-diagnostics:
    if: ${{ inputs.verification == 'diagnostics' }}
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      # Trusted CI setup mounts only bounded owned outputs. Inner compiler and
      # worker Landlock/seccomp, memory and launcher admission remain mandatory.
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private --cap-add=SYS_ADMIN --security-opt apparmor=unconfined
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    env:
      # Preserve compiler statistics through the long runtime campaigns.
      DAY2_TEMPORAL_CLI: /tmp/day2-tools/temporal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create the single-job Rust codegen jobserver
        run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
      - name: Download the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64 --dir /tmp/day2-bazel-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the pinned Linux Bazel bytes
        if: ${{ runner.os == 'Linux' }}
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned Linux Bazel executable
        if: ${{ runner.os == 'Linux' }}
        run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Restore Bazel compilation and repository caches
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verification-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verification-diagnostics-${{ github.sha }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-tests-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verification-diagnostics-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier with Bazel
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - run: build-out/bin/xtask source-check
      - run: build-out/bin/xtask notices
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
      - run: build-out/bin/xtask bootstrap
      - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - run: build-out/bin/xtask configure-tofu
      - run: build-out/bin/xtask fmt
      - run: git diff --binary > /tmp/day2-format.patch
      - run: build-out/bin/xtask architecture-inventory > /tmp/day2-architecture-inventory.json
      - run: build-out/bin/xtask architecture-dependencies > /tmp/day2-architecture-dependencies.json
      - run: build-out/bin/xtask architecture-proof-inventory > /tmp/day2-architecture-proofs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: day2-verification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/day2-format.patch
            /tmp/day2-architecture-inventory.json
            /tmp/day2-architecture-dependencies.json
            /tmp/day2-architecture-proofs.json
            artifacts/bazel-compiler-inputs.json
          if-no-files-found: error
          retention-days: 3

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        stack: [cluster, app-edge, security-shell-edge, security-shell, security-epoch-controller, day2-app, qualification-runner, native-enrollment, native-enrollment-observer-access, native-enrollment-pool, native-enrollment-profile, native-enrollment-root]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/gke/stacks
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} validate
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} test

  gitea-integration-example:
    # Tests an opt-in provider example; it is not part of the core GKE apply order.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/integrations
      - run: tofu -chdir=deploy/integrations/gitea-instance-ci init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/integrations/gitea-instance-ci validate
      - run: tofu -chdir=deploy/integrations/gitea-instance-ci test
      - run: tofu -chdir=deploy/integrations/gitea-qualification-runner init -backend=false -lockfile=readonly
