---
name: Linux test memory diagnostic (temporary)
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit to observe; diagnostic workflow is separate
        type: string
        required: true
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: "${{ inputs.source }}"
    - run: gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz
        --dir /tmp/scanners
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: sha256sum --check "$GITHUB_WORKSPACE/.github/gitleaks.sha256"
      working-directory: "/tmp/scanners"
    - run: tar -xzf /tmp/scanners/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/scanners
    - run: "/tmp/scanners/gitleaks dir . --redact=100 --config .gitleaks.toml"
    - run: "/tmp/scanners/gitleaks git . --redact=100 --config .gitleaks.toml"
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: "${{ inputs.source }}"
    - run: gh release download cargo-audit/v0.22.2 --repo RustSec/rustsec --pattern
        cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz --dir /tmp/scanners
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: sha256sum --check "$GITHUB_WORKSPACE/.github/cargo-audit.sha256"
      working-directory: "/tmp/scanners"
    - run: tar -xzf /tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
        -C /tmp/scanners
    - run: "/tmp/scanners/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
        audit --deny warnings"
  test-memory:
    needs:
    - secrets
    - dependencies
    runs-on: ubuntu-24.04
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      options: "--memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private
        --cap-add=SYS_ADMIN --security-opt apparmor=unconfined"
      volumes:
      - "/usr/bin/gh:/usr/local/bin/gh:ro"
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part:
        - tests
    env:
      CARGO_MAKEFLAGS: "--jobserver-auth=fifo:/var/tmp/day2-rustc-jobserver"
      DAY2_TEMPORAL_CLI: "/tmp/day2-tools/temporal"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Compile the std-only numeric observer
      run: rustc --edition=2024 -Copt-level=0 .github/diagnostics/compile_memory.rs
        -o /tmp/day2-compile-memory
      env:
        CARGO_MAKEFLAGS: ''
    - name: Check out the exact source under observation
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: "${{ inputs.source }}"
        persist-credentials: false
    - name: Create the single-job Rust codegen jobserver
      run: mkfifo --mode=600 /var/tmp/day2-rustc-jobserver
    - name: Download the pinned Linux Bazel executable
      if: "${{ runner.os == 'Linux' }}"
      run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64
        --dir /tmp/day2-bazel-tools
      env:
        GH_TOKEN: "${{ github.token }}"
    - name: Verify the pinned Linux Bazel bytes
      if: "${{ runner.os == 'Linux' }}"
      run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64'
        | sha256sum --check
    - name: Install the pinned Linux Bazel executable
      if: "${{ runner.os == 'Linux' }}"
      run: install -m 0555 /tmp/day2-bazel-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
    - name: Restore Bazel compilation and repository caches
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
      with:
        bazelisk-cache: true
        repository-cache: true
        disk-cache: false
        cache-save: false
    - name: Restore source-keyed compiled actions
      id: bazel_actions
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        lookup-only: true
        path: "~/.cache/bazel-disk"
        key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{
          matrix.part }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: |
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-${{ github.sha }}-
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verify-prepare-parts-${{ matrix.part }}-
          day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Compile and install the current verifier with Bazel
      run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor"
        run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"
        //crates/xtask:xtask -- install-verifier
    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
      with:
        tofu_version: 1.11.5
        tofu_wrapper: false
    - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz
        --dir /tmp/day2-tools
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
      working-directory: "/tmp/day2-tools"
    - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
    - name: Install the browser test runtime
      if: "${{ matrix.part == 'inputs' }}"
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.3
    - name: Establish the mandatory bounded native Linux compiler context
      id: linux_context
      run: build-out/bin/xtask verify-linux-context
    - name: Retain current native Linux preparation context
      if: "${{ always() && steps.linux_context.outcome == 'success' }}"
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day2-linux-context-preparation-${{ matrix.part }}-${{ github.run_id
          }}-${{ github.run_attempt }}
        path: "/tmp/day2-ci-linux-context.json"
        if-no-files-found: error
        retention-days: 14
    - name: Restore completed fixture builds
      id: fixture_cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: "${{ matrix.part == 'inputs' }}"
      with:
        lookup-only: true
        key: day2-fixtures-v3-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion',
          '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**',
          'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml',
          'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml',
          'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**',
          'deploy/**', 'toolchains/**', 'sdk/**') }}-${{ hashFiles('cli/**', 'fixtures/**',
          'examples/**') }}
        restore-keys: 'day2-fixtures-v3-bazel-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles(''.bazelversion'', ''.bazelrc'', ''BUILD.bazel'', ''MODULE.bazel'',
          ''MODULE.bazel.lock'', ''build/bazel/**'', ''Cargo.toml'', ''Cargo.lock'',
          ''build-dependencies/**'', ''.dockerignore'', ''rust-toolchain.toml'', ''toolchain.json'',
          ''architecture*.json'', ''architecture/**'', ''.github/workflows/ci.yml'',
          ''crates/**'', ''tools/**'', ''vendor/**'', ''assets/**'', ''ops/**'', ''infra/**'',
          ''deploy/**'', ''toolchains/**'', ''sdk/**'') }}-

'
        path: |
          artifacts/all-verification-cache.json
          artifacts/????????????????????????????????????????????????????????????????
    - name: Restore completed test executables
      id: test_cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: "${{ matrix.part == 'tests' }}"
      with:
        lookup-only: true
        key: day2-test-outputs-v2-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion',
          '.bazelrc', 'BUILD.bazel', 'MODULE.bazel', 'MODULE.bazel.lock', 'build/bazel/**',
          'Cargo.toml', 'Cargo.lock', 'build-dependencies/**', '.dockerignore', 'rust-toolchain.toml',
          'toolchain.json', 'architecture*.json', 'architecture/**', '.github/workflows/ci.yml',
          'crates/**', 'tools/**', 'vendor/**', 'assets/**', 'ops/**', 'infra/**',
          'deploy/**', 'toolchains/**', 'sdk/**', 'cli/**', 'fixtures/**', 'examples/**')
          }}
        path: |
          artifacts/ci-test-build-cache.json
          artifacts/ci-test-programs
          build-out/tests/*
    - run: build-out/bin/xtask source-check
    - run: build-out/bin/xtask notices
    - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
    - name: Restore pinned native compiler and formatter inputs
      id: native_tools
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: "${{ matrix.part == 'inputs' }}"
      with:
        path: "/__w/${{ github.event.repository.name }}/.toolchains"
        key: day2-native-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json',
          'toolchains/**', 'tools/**', 'crates/xtask/src/native_toolchain.rs', 'crates/xtask/src/main.rs',
          'crates/xtask/src/formatting.rs', 'crates/xtask/src/formatter_bootstrap.rs')
          }}
    - run: build-out/bin/xtask bootstrap
    - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform
        --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
      env:
        GH_TOKEN: "${{ github.token }}"
    - run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
    - name: Save pinned native compiler and formatter inputs
      if: "${{ matrix.part == 'inputs' && steps.native_tools.outputs.cache-hit !=
        'true' }}"
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: "/__w/${{ github.event.repository.name }}/.toolchains"
        key: "${{ steps.native_tools.outputs.cache-primary-key }}"
    - run: build-out/bin/xtask configure-tofu
    - run: "/tmp/day2-compile-memory"
      id: native_preparation
      name: Observe the unchanged all-target test preparation
    - name: Retain numeric process and cgroup observations
      if: "${{ always() }}"
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-test-memory-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          /tmp/day2-compile-memory.jsonl
          artifacts/bazel/failures/*/outcome.json
          artifacts/ci-test-build-cache.json
          artifacts/ci-preparation-tests.json
          artifacts/bazel-compiler-inputs.json
        if-no-files-found: error
        retention-days: 3
