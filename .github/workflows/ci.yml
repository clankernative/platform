        with:
          name: day2-linux-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-linux-verifier
      - name: Retry download of day2-linux-verifier-${{ github.run_id }}-${{ github.run_attempt }}
        if: ${{ !cancelled() && steps.artifact_download_1.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: day2-linux-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/day2-linux-verifier
      # Bootstrap only the verifier from this run's successful preparation.
      # Do not restore artifacts or generated worker files before their bounded
      # mounts exist; the context check must see the original checkout ABI seed.
      - name: Restore the current run verifier only
        run: tar -xzf /tmp/day2-linux-verifier/day2-linux-verifier.tgz -C "$GITHUB_WORKSPACE" build-out/bin/xtask
      - name: Establish the mandatory bounded native Linux compiler context
