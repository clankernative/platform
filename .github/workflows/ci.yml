      - name: Restore test compilation outputs
        run: tar -xzf /tmp/day2-preparation-tests/day2-preparation.tgz -C "$GITHUB_WORKSPACE"
      - name: Restore pinned native compiler and formatter inputs
        id: native_tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /__w/${{ github.event.repository.name }}/.toolchains
          key: day2-native-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.json', 'toolchains/**', 'tools/**', 'crates/xtask/src/native_toolchain.rs', 'crates/xtask/src/main.rs', 'crates/xtask/src/formatting.rs', 'crates/xtask/src/formatter_bootstrap.rs') }}
      - name: Download pinned compiler inputs on cache miss
        if: ${{ steps.native_tools.outputs.cache-hit != 'true' }}
