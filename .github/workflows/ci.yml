          repository-cache: true
          disk-cache: false
          cache-save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/')) }}
      - name: Restore source-keyed compiled actions
        id: bazel_actions
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          lookup-only: ${{ inputs.compilation_cache == 'empty' }}
          path: ~/.cache/bazel-disk
          key: day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verification-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verification-diagnostics-${{ github.sha }}-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-verification-diagnostics-
            day2-bazel-actions-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and install the current verifier with Bazel
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" run --config=ci-linux --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo" //crates/xtask:xtask -- install-verifier
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: gh release download v1.6.1 --repo temporalio/cli --pattern temporal_cli_1.6.1_linux_amd64.tar.gz --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum --check "$GITHUB_WORKSPACE/.github/temporal-linux.sha256"
        working-directory: /tmp/day2-tools
      - run: tar -xzf /tmp/day2-tools/temporal_cli_1.6.1_linux_amd64.tar.gz -C /tmp/day2-tools
      - run: build-out/bin/xtask source-check
      - run: build-out/bin/xtask notices
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt dependency-inventory.json
      - run: build-out/bin/xtask bootstrap
      - run: gh release download roc-formatter-linux-2026-09-12 --repo clankernative/platform --pattern roc-fmt-day2-x86_64-unknown-linux-gnu --dir /tmp/day2-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - run: build-out/bin/xtask bootstrap-formatter /tmp/day2-tools/roc-fmt-day2-x86_64-unknown-linux-gnu
      - run: build-out/bin/xtask configure-tofu
      - run: build-out/bin/xtask fmt
      - run: git diff --binary > /tmp/day2-format.patch
      - run: build-out/bin/xtask architecture-inventory > /tmp/day2-architecture-inventory.json
      - run: build-out/bin/xtask architecture-dependencies > /tmp/day2-architecture-dependencies.json
      - run: build-out/bin/xtask architecture-proof-inventory > /tmp/day2-architecture-proofs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: day2-verification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/day2-format.patch
            /tmp/day2-architecture-inventory.json
            /tmp/day2-architecture-dependencies.json
            /tmp/day2-architecture-proofs.json
            artifacts/bazel-compiler-inputs.json
          if-no-files-found: error
          retention-days: 3

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        stack: [cluster, app-edge, security-shell-edge, security-shell, security-epoch-controller, day2-app, qualification-runner, native-enrollment, native-enrollment-observer-access, native-enrollment-pool, native-enrollment-profile, native-enrollment-root]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/gke/stacks
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} validate
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} test

