          path: artifacts/storage-lifecycle-simulation/failure-*/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain failed native OAuth consumer histories
        if: ${{ failure() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-native-oauth-consumer-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oauth-native-consumer-simulation/failure-*/failure.json
            artifacts/oauth-native-consumer-simulation/failure-*/record-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain connection request reference evidence
        if: ${{ always() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-connection-request-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-connection-request-simulation/campaign-*/receipt.json
            artifacts/native-connection-request-simulation/failure-*/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish actual Linear campaign coverage
        if: ${{ always() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linear-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linear-provider-simulation/campaign-*/receipt.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14
      - name: Retain redacted Linear replay seeds
        if: ${{ failure() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-linear-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linear-provider-simulation/failure-*/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish actual operator-alert campaign coverage
        if: ${{ always() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-alerts-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/alerts-provider-simulation/campaign-*/receipt.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14
      - name: Retain redacted operator-alert replay seeds
        if: ${{ failure() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-alerts-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/alerts-provider-simulation/failure-*/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish actual credential process-loss coverage
        if: ${{ always() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-credential-crash-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/credential-crash-reopen/campaign-*/receipt.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14
      - name: Retain redacted credential process-loss cases
        if: ${{ failure() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-credential-crash-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/credential-crash-reopen/failure-*/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish actual Notifications campaign coverage
        if: ${{ always() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-notifications-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/notification-provider-simulation/campaign-*/receipt.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 14
      - name: Retain redacted Notifications replay seeds
        if: ${{ failure() && matrix.shard == 'workspace-day2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: day2-notifications-replays-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/notification-provider-simulation/failure-*/failure.json
          if-no-files-found: ignore
