          name: day2-verification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/day2-format.patch
            /tmp/day2-architecture-inventory.json
            /tmp/day2-architecture-dependencies.json
            /tmp/day2-architecture-proofs.json
            artifacts/bazel-compiler-inputs.json
          if-no-files-found: error
          retention-days: 3

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_PLUGIN_CACHE_DIR: /tmp/day2-tofu-providers
      TF_PROVIDER_DOWNLOAD_RETRY: '5'
      TF_REGISTRY_DISCOVERY_RETRY: '5'
      TF_REGISTRY_CLIENT_TIMEOUT: '30'
    strategy:
      matrix:
        stack: [cluster, app-edge, security-shell-edge, security-shell, security-epoch-controller, day2-app, qualification-runner, native-enrollment, native-enrollment-observer-access, native-enrollment-pool, native-enrollment-profile, native-enrollment-root]
    steps:
      - name: Create the job-local provider cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned OpenTofu archive
        timeout-minutes: 2
        uses: ./.github/actions/pinned-release
        with:
          repository: opentofu/opentofu
          tag: v1.11.5
          asset: tofu_1.11.5_linux_amd64.zip
          sha256: 901121681e751574d739de5208cad059eddf9bd739b575745cf9e3c961b28a13
          path: /tmp/day2-opentofu/tofu.zip
      - name: Install the pinned OpenTofu CLI
        timeout-minutes: 4
        run: |
          echo '901121681e751574d739de5208cad059eddf9bd739b575745cf9e3c961b28a13  /tmp/day2-opentofu/tofu.zip' | sha256sum --check
          unzip -j -o /tmp/day2-opentofu/tofu.zip tofu -d /tmp/day2-opentofu/bin
          chmod 0555 /tmp/day2-opentofu/bin/tofu
          echo /tmp/day2-opentofu/bin >> "$GITHUB_PATH"
      - run: tofu fmt -check -recursive deploy/gke/stacks
      - name: Restore lockfile-keyed OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: day2-tofu-providers-v1-${{ runner.os }}-${{ runner.arch }}-1.11.5-${{ hashFiles(format('deploy/gke/stacks/{0}/.terraform.lock.hcl', matrix.stack)) }}
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} init -backend=false -lockfile=readonly
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} validate
      - run: tofu -chdir=deploy/gke/stacks/${{ matrix.stack }} test

