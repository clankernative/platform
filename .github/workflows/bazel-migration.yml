name: Bazel migration qualification

on:
  push:
    branches: [build/bazel-platform-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graph:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: ci-linux
          - os: macos-15
            config: ci-mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Log exact source
        run: git show -s --format=fuller HEAD
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: platform-migration-${{ runner.os }}-${{ runner.arch }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/build/bazel-platform-migration' }}
      - name: Analyze the complete workspace with parameter files
        run: bazel aquery --lockfile_mode=update --config=${{ matrix.config }} --include_param_files --output=jsonproto 'deps(set(//:all_programs //:test_binaries //crates/worker:lib //cli/checks:lib))' > /tmp/day2-bazel-actions.json
      - name: Check normal and build-tool feature context selection
        run: bazel build --config=${{ matrix.config }} //build/bazel:context_controls
      - name: Check production normal and build-tool context selection
        run: bazel build --config=${{ matrix.config }} --config=release --config=production //build/bazel:context_controls
      - name: Analyze production binaries without test dependency features
        run: bazel aquery --config=${{ matrix.config }} --config=release --config=production --include_param_files --output=jsonproto 'deps(set(//:all_programs //crates/worker:lib))' > /tmp/day2-bazel-production-actions.json
      - name: Execute the whole patched compiler wrapper control module
        run: bazel test --config=${{ matrix.config }} --test_output=all @rules_rust//util/process_wrapper:process_wrapper_test
      - name: Compile the converted verifier and its controls
        run: bazel build --config=${{ matrix.config }} --build_event_json_file=/tmp/day2-bazel-build.json //crates/xtask:xtask //crates/xtask:unit_xtask //crates/day2-control:control_integration
      - name: Execute actual build process and evidence controls
        run: |
          bazel test --config=${{ matrix.config }} --test_output=all --test_arg=build_capture::tests:: --test_arg=--nocapture //crates/xtask:unit_xtask
      - name: Execute portable offline repository admission controls
        run: |
          bazel test --config=${{ matrix.config }} --test_output=all --test_arg=build::bazel_sources::tests:: --test_arg=--nocapture //crates/day2-control:unit_lib
      - name: Execute actual verifier installation identity controls
        run: |
          bazel test --config=${{ matrix.config }} --test_output=all --test_arg=tests::cli_install_ --test_arg=--nocapture //crates/xtask:unit_xtask
      - name: Execute source capture and worker ABI seed controls
        run: |
          bazel test --config=${{ matrix.config }} --test_output=all --test_arg=build::platform_ //crates/day2-control:control_integration
      - name: Execute actual policy and CI source mutation refusal
        run: |
          bazel test --config=${{ matrix.config }} --test_output=all --test_arg=build::architecture_policy_changes_invalidate_the_platform_and_materialization --test_arg=--exact //crates/day2-control:control_integration
      - name: Execute build input identity controls
        run: |
          bazel test --config=${{ matrix.config }} --test_output=all --test_arg=bazel::tests:: --test_arg=--nocapture //crates/xtask:unit_xtask
      - name: Install the current verifier
        run: bazel --batch run --config=${{ matrix.config }} //crates/xtask:xtask -- install-verifier
      - name: Collect current source effect inventory for review
        run: build-out/bin/xtask architecture-inventory > /tmp/day2-bazel-architecture-inventory.json
      - name: Build a real harness through configured-producer admission
        run: build-out/bin/xtask build-rust-test //crates/xtask:unit_xtask
      - name: Execute actual dependency and coverage controls
        run: |
          build-out/bin/xtask test-rust //crates/xtask:unit_xtask architecture_dependencies::tests:: --nocapture
      - name: Check every manifest default target against the Bazel catalog
        run: build-out/bin/xtask architecture-dependencies
      - name: Check real compiler-backed architectural refusals
        run: |
          build-out/bin/xtask test-rust //crates/xtask:unit_xtask architecture_kernel::tests:: --test-threads=1 --nocapture
      - name: Enforce current architecture roles, effects and native proofs
        run: build-out/bin/xtask architecture-check
      - name: Enforce whole-workspace all-target Clippy
        run: build-out/bin/xtask lint
      - name: Retain exact graph, lockfile and build outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bazel-migration-${{ runner.os }}-${{ runner.arch }}
          path: |
            /tmp/day2-bazel-actions.json
            /tmp/day2-bazel-production-actions.json
            /tmp/day2-bazel-build.json
            /tmp/day2-bazel-architecture-inventory.json
            MODULE.bazel.lock
            build/bazel/targets.json
          if-no-files-found: error

  private-build-probe:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retain exact focused private-builder source
        run: git show -s --format=fuller HEAD
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: platform-migration-${{ runner.os }}-${{ runner.arch }}
          cache-save: true
      - name: Install the current diagnostic verifier
        run: bazel --batch run --config=ci-mac //crates/xtask:xtask -- install-verifier
      - name: Bootstrap the unchanged current native compiler inputs
        run: build-out/bin/xtask bootstrap
      - name: Execute the existing real private-build case through the Roc probe recipe
        run: build-out/bin/xtask verify-private-build-probe
