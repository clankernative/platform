name: Bazel migration qualification
on:
  workflow_dispatch:
    inputs:
      probe:
        type: choice
        options: [mac-bootstrap, linux-tool]
        default: mac-bootstrap
permissions:
  contents: read
jobs:
  private-bootstrap:
    if: ${{ inputs.probe != 'linux-tool' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git show -s --format=fuller HEAD
      - name: Download the exact private Mac Bazel pin
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-darwin-arm64 --dir '${{ runner.temp }}/private-bazel-download'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the standalone binary
        working-directory: ${{ runner.temp }}/private-bazel-download
        run: echo 'f29ca3f3bf577eb1619aeeed401b64a10901c8da8031aaa4add54a4ad0e99e3a  bazel-9.3.0-darwin-arm64' | shasum -a 256 --check
      - name: Create only empty public probe directories
        run: mkdir -p '${{ runner.temp }}/private-bazel-probe/bin' '${{ runner.temp }}/private-bazel-probe/home' '${{ runner.temp }}/private-bazel-probe/tmp' '${{ runner.temp }}/private-bazel-probe/platform'
      - name: Stage only the pinned launcher
        run: install -m 0555 '${{ runner.temp }}/private-bazel-download/bazel-9.3.0-darwin-arm64' '${{ runner.temp }}/private-bazel-probe/bin/bazel'
      - name: Stage only the ordinary Bazel configuration
        run: cp .bazelrc '${{ runner.temp }}/private-bazel-probe/platform/.bazelrc'
      - name: Stage the empty public workspace descriptor
        run: cp .github/bazel-private-probe.MODULE '${{ runner.temp }}/private-bazel-probe/platform/MODULE.bazel'
      - name: Create a public outside-root refusal witness
        run: cp .github/bazel-private-probe.MODULE '${{ runner.temp }}/private-bazel-outside-marker'
      - name: Establish the outside witness is actually readable
        run: /bin/cat '${{ runner.temp }}/private-bazel-outside-marker'
      - name: Establish the outside witness is actually writable
        run: /usr/bin/touch '${{ runner.temp }}/private-bazel-outside-marker'
      - name: Stage only the fixed public metadata action
        run: cp .github/bazel-private-probe.BUILD '${{ runner.temp }}/private-bazel-probe/platform/BUILD.bazel'
      - name: Stage only the fixed public action declaration
        run: cp .github/bazel-private-probe.bzl '${{ runner.temp }}/private-bazel-probe/platform/probe.bzl'
      - name: Prefetch only the empty public action's analysis dependencies outside confinement
        working-directory: ${{ runner.temp }}/private-bazel-probe/platform
        run: /usr/bin/env -i LANG=C LC_ALL=C TZ=UTC HOME='${{ runner.temp }}/private-bazel-probe/home' TMPDIR='${{ runner.temp }}/private-bazel-probe/tmp' PATH=/usr/bin:/bin OPENSSL_CONF=/dev/null '${{ runner.temp }}/private-bazel-probe/bin/bazel' --batch --nosystem_rc --nohome_rc --output_user_root='${{ runner.temp }}/private-bazel-probe/bazel-output' build --lockfile_mode=update --define=DAY2_PUBLIC_PROBE=outside //:marker
      - name: Exercise only the required power-notification client with no app or SDK inputs
        working-directory: ${{ runner.temp }}/private-bazel-probe/platform
        run: /usr/bin/env -i LANG=C LC_ALL=C TZ=UTC HOME='${{ runner.temp }}/private-bazel-probe/home' TMPDIR='${{ runner.temp }}/private-bazel-probe/tmp' PATH=/usr/bin:/bin OPENSSL_CONF=/dev/null /usr/bin/sandbox-exec -D 'PRIVATE_JOB=${{ runner.temp }}/private-bazel-probe' -f '${{ github.workspace }}/.github/bazel-private-probe.sb' '${{ runner.temp }}/private-bazel-probe/bin/bazel' --batch --nosystem_rc --nohome_rc --output_user_root='${{ runner.temp }}/private-bazel-probe/bazel-output' version

      - name: Observe a fresh public action with the default inner Bazel strategy
        id: default_strategy
        continue-on-error: true
        working-directory: ${{ runner.temp }}/private-bazel-probe/platform
        run: /usr/bin/env -i LANG=C LC_ALL=C TZ=UTC HOME='${{ runner.temp }}/private-bazel-probe/home' TMPDIR='${{ runner.temp }}/private-bazel-probe/tmp' PATH=/usr/bin:/bin OPENSSL_CONF=/dev/null /usr/bin/sandbox-exec -D 'PRIVATE_JOB=${{ runner.temp }}/private-bazel-probe' -f '${{ github.workspace }}/.github/bazel-private-probe.sb' '${{ runner.temp }}/private-bazel-probe/bin/bazel' --batch --nosystem_rc --nohome_rc --output_user_root='${{ runner.temp }}/private-bazel-probe/bazel-output' build --repository_disable_download --define=DAY2_PUBLIC_PROBE=nested //:marker
      - name: Execute a different fresh public action inside only the existing outer profile
        working-directory: ${{ runner.temp }}/private-bazel-probe/platform
        run: /usr/bin/env -i LANG=C LC_ALL=C TZ=UTC HOME='${{ runner.temp }}/private-bazel-probe/home' TMPDIR='${{ runner.temp }}/private-bazel-probe/tmp' PATH=/usr/bin:/bin OPENSSL_CONF=/dev/null /usr/bin/sandbox-exec -D 'PRIVATE_JOB=${{ runner.temp }}/private-bazel-probe' -f '${{ github.workspace }}/.github/bazel-private-probe.sb' '${{ runner.temp }}/private-bazel-probe/bin/bazel' --batch --nosystem_rc --nohome_rc --output_user_root='${{ runner.temp }}/private-bazel-probe/bazel-output' build --repository_disable_download --spawn_strategy=standalone --define=DAY2_PUBLIC_PROBE=outer //:marker
      - name: Retain the actual default strategy observation
        run: echo 'default-strategy=${{ steps.default_strategy.outcome }}'
      - name: Require outside-root reads to remain refused
        id: outside_read
        continue-on-error: true
        run: /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/sandbox-exec -D 'PRIVATE_JOB=${{ runner.temp }}/private-bazel-probe' -f '${{ github.workspace }}/.github/bazel-private-probe.sb' /bin/cat '${{ runner.temp }}/private-bazel-outside-marker'
      - name: Require outside-root writes to remain refused
        id: outside_write
        continue-on-error: true
        run: /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/sandbox-exec -D 'PRIVATE_JOB=${{ runner.temp }}/private-bazel-probe' -f '${{ github.workspace }}/.github/bazel-private-probe.sb' /usr/bin/touch '${{ runner.temp }}/private-bazel-outside-marker'
      - name: Establish the public network witness is reachable outside confinement
        run: /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/curl --noproxy '*' --silent --show-error --fail --max-time 10 http://1.1.1.1/ --output '${{ runner.temp }}/private-bazel-probe/network-witness'
      - name: Require network access to remain refused
        id: network
        continue-on-error: true
        run: /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/sandbox-exec -D 'PRIVATE_JOB=${{ runner.temp }}/private-bazel-probe' -f '${{ github.workspace }}/.github/bazel-private-probe.sb' /usr/bin/curl --noproxy '*' --silent --show-error --fail --max-time 5 http://1.1.1.1/ --output '${{ runner.temp }}/private-bazel-probe/network-negative'
      - name: Admit only actual startup and all three actual refusals
        run: test '${{ steps.outside_read.outcome }}:${{ steps.outside_write.outcome }}:${{ steps.network.outcome }}' = failure:failure:failure

  configured-tool:
    if: ${{ inputs.probe == 'linux-tool' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: rust@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959
      options: --memory=6g --memory-swap=6g --cpus=4 --pids-limit=512 --cgroupns=private
      volumes:
        - /usr/bin/gh:/usr/local/bin/gh:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: git show -s --format=fuller HEAD
      - name: Download the pinned Linux Bazel launcher
        run: gh release download 9.3.0 --repo bazelbuild/bazel --pattern bazel-9.3.0-linux-x86_64 --dir /tmp/day2-bazel-probe-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the exact launcher
        run: echo 'd302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8  /tmp/day2-bazel-probe-tools/bazel-9.3.0-linux-x86_64' | sha256sum --check
      - name: Install the pinned launcher
        run: install -m 0555 /tmp/day2-bazel-probe-tools/bazel-9.3.0-linux-x86_64 /usr/local/bin/bazel
      - name: Populate only the toolchain action cache in an owned donor context
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-probe-donor" build --config=ci-linux --disk_cache="$GITHUB_WORKSPACE/.cache/bazel-probe-actions" --repository_cache=/tmp/day2-bazel-probe-repositories @rules_rust//rust/toolchain:current_rustc_files
      - name: Remove only the disposable donor output base
        run: rm -rf "$GITHUB_WORKSPACE/.cache/bazel-probe-donor"
      - name: Restore the configured tool into an empty consumer output base
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" build --config=ci-linux --disk_cache="$GITHUB_WORKSPACE/.cache/bazel-probe-actions" --repository_cache=/tmp/day2-bazel-probe-repositories @rules_rust//rust/toolchain:current_rustc_files
      - name: Retain actual configured tool output paths
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" cquery --config=ci-linux --disk_cache="$GITHUB_WORKSPACE/.cache/bazel-probe-actions" --repository_cache=/tmp/day2-bazel-probe-repositories --output=files @rules_rust//rust/toolchain:current_rustc_files
      - name: Retain the actual consumer execution root
        run: bazel --batch --nosystem_rc --nohome_rc --output_base="$GITHUB_WORKSPACE/.cache/bazel-executor" info --config=ci-linux --disk_cache="$GITHUB_WORKSPACE/.cache/bazel-probe-actions" --repository_cache=/tmp/day2-bazel-probe-repositories execution_root
      - name: Inspect only the configured tool symlink
        run: ls -l bazel-bin/external/rules_rust++rust+rust_linux_x86_64__x86_64-unknown-linux-gnu__stable_tools/rust_toolchain/bin/rustc
      - name: Execute that selected official tool after cache relocation
        run: bazel-bin/external/rules_rust++rust+rust_linux_x86_64__x86_64-unknown-linux-gnu__stable_tools/rust_toolchain/bin/rustc --version
