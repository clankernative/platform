<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Deletion: keep history, hide deleted work</title>
  <desc id="desc">SQLite retains live and soft-deleted rows. Inspection includes retained rows for storage and replay comparisons. Application snapshots and legacy pages exclude deleted rows. Delete and restore validate the stored row, not an empty JSON payload, before the existing authority and version checks.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker></defs>
  <rect width="800" height="600" fill="white"/>
  <g font-family="sans-serif" fill="#1e1e1e">
    <text x="52" y="44" font-size="25">Deletion: keep history, hide deleted work</text>
    <text x="52" y="74" font-size="16" fill="#757575">Standalone runtime fix — no UI or schema change</text>
    <rect x="250" y="100" width="300" height="75" rx="12" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
    <text x="400" y="131" text-anchor="middle" font-size="18"><tspan x="400">SQLite retains all rows</tspan><tspan x="400" dy="24">live + soft-deleted</tspan></text>
    <path d="M300 175 L170 230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="50" y="230" width="240" height="100" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="170" y="261" text-anchor="middle" font-size="17"><tspan x="170">inspect()</tspan><tspan x="170" dy="24">all retained rows</tspan><tspan x="170" dy="24">storage / replay comparison</tspan></text>
    <path d="M500 175 L630 230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="574" y="191" font-size="16">deleted_at = 0</text>
    <rect x="500" y="230" width="250" height="100" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
    <text x="625" y="261" text-anchor="middle" font-size="17"><tspan x="625">application_snapshot()</tspan><tspan x="625" dy="24">live rows only</tspan><tspan x="625" dy="24">app properties / generators</tspan></text>
    <text x="475" y="359" font-size="16" fill="#15803d"><tspan x="475">Legacy pages filter before LIMIT.</tspan><tspan x="475" dy="22">Both snapshots reject oversize state.</tspan></text>
    <text x="50" y="412" font-size="20">Lifecycle commands: no editable payload</text>
    <rect x="50" y="435" width="180" height="75" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="140" y="465" text-anchor="middle" font-size="16"><tspan x="140">soft_delete / restore</tspan><tspan x="140" dy="22">id + version, no JSON</tspan></text>
    <path d="M230 472 L275 472" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="275" y="435" width="240" height="75" rx="12" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
    <text x="395" y="455" text-anchor="middle" font-size="16"><tspan x="395">Load stored row</tspan><tspan x="395" dy="22">validate its domain values</tspan><tspan x="395" dy="22">not the empty payload</tspan></text>
    <path d="M515 472 L560 472" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="435" width="190" height="75" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
    <text x="655" y="455" text-anchor="middle" font-size="16"><tspan x="655">Existing authority +</tspan><tspan x="655" dy="22">version checks</tspan><tspan x="655" dy="22">commit lifecycle change</tspan></text>
    <text x="50" y="555" font-size="16" fill="#757575">Create / update still validate supplied fields. Audit history remains intact.</text>
  </g>
</svg>
