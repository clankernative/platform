<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title"><title id="title">studio-edit-loop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#253046"/></marker></defs><rect width="1200" height="900" fill="#ffffff"/><g font-family="Trebuchet MS, sans-serif"><rect x="50" y="155" width="280" height="125" rx="12" fill="#a5d8ff" stroke="#253046" stroke-width="2"/><path d="M330 218 L450 218" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="155" width="285" height="125" rx="12" fill="#c3fae8" stroke="#253046" stroke-width="2"/><path d="M593 280 L593 375" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="450" y="375" width="285" height="120" rx="12" fill="#d0bfff" stroke="#253046" stroke-width="2"/><path d="M735 218 L850 218" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="850" y="155" width="295" height="125" rx="12" fill="#ffd8a8" stroke="#253046" stroke-width="2"/><path d="M997 280 L997 375" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="997,375 1097,442.5 997,510 897,442.5" fill="#fff3bf" stroke="#253046" stroke-width="2"/><path d="M950 490 L840 490 L840 625" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="700" y="625" width="285" height="115" rx="12" fill="#b2f2bb" stroke="#253046" stroke-width="2"/><path d="M1097 443 L1132 443 L1132 625" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1010" y="625" width="150" height="115" rx="12" fill="#ffc9c9" stroke="#253046" stroke-width="2"/><rect x="50" y="375" width="280" height="120" rx="12" fill="#fff3bf" stroke="#253046" stroke-width="2" stroke-dasharray="8 6"/><path d="M190 375 L190 280" fill="none" stroke="#253046" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="50" y="625" width="580" height="115" rx="12" fill="#fff3bf" stroke="#253046" stroke-width="2"/><text x="50" y="65" fill="#253046" font-size="30"><tspan x="50" dy="0">Studio edit loop — fast feedback, authoritative admission</tspan></text><text x="50" y="107" fill="#555555" font-size="22"><tspan x="50" dy="0">Same app sources and locked compiler · two deliberately different proofs</tspan></text><text x="190" y="198.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="190" dy="0">Studio + agent</tspan><tspan x="190" dy="27.5">Read component contracts</tspan><tspan x="190" dy="27.5">Guarded UI edits + undo</tspan></text><rect x="344.1" y="205.5" width="91.8" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="390" y="225.5" text-anchor="middle" font-size="20" fill="#253046"><tspan x="390" dy="0">save UI</tspan></text><text x="592.5" y="198.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="592.5" dy="0">App UI sources</tspan><tspan x="592.5" dy="27.5">HTML declarations + CSS</tspan><tspan x="592.5" dy="27.5">Revision-checked changes</tspan></text><rect x="535.7" y="315" width="114.6" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="593" y="335" text-anchor="middle" font-size="20" fill="#253046"><tspan x="593" dy="0">immediate</tspan></text><text x="592.5" y="415.75" text-anchor="middle" font-size="22" fill="#253046"><tspan x="592.5" dy="0">Clanker static preview</tspan><tspan x="592.5" dy="27.5">Locked templates + fake data</tspan><tspan x="592.5" dy="27.5">No app commands or scripts</tspan></text><rect x="758" y="205.5" width="69" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="792.5" y="225.5" text-anchor="middle" font-size="20" fill="#253046"><tspan x="792.5" dy="0">watch</tspan></text><text x="997.5" y="198.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="997.5" dy="0">Platform build</tspan><tspan x="997.5" dy="27.5">Capture + compile + verify</tspan><tspan x="997.5" dy="27.5">Independent UI admission</tspan></text><rect x="956.8" y="315" width="80.39999999999999" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="997" y="335" text-anchor="middle" font-size="20" fill="#253046"><tspan x="997" dy="0">result</tspan></text><text x="997" y="451.5" text-anchor="middle" font-size="24" fill="#253046"><tspan x="997" dy="0">Admitted?</tspan></text><rect x="871.9" y="545" width="46.199999999999996" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="895" y="565" text-anchor="middle" font-size="20" fill="#253046"><tspan x="895" dy="0">yes</tspan></text><text x="842.5" y="663.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="842.5" dy="0">Real app preview</tspan><tspan x="842.5" dy="27.5">New admitted artifact</tspan><tspan x="842.5" dy="27.5">Real authorization + behavior</tspan></text><rect x="1097.1" y="521.5" width="34.8" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="1114.5" y="541.5" text-anchor="middle" font-size="20" fill="#253046"><tspan x="1114.5" dy="0">no</tspan></text><text x="1085" y="663.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="1085" dy="0">Rejected</tspan><tspan x="1085" dy="27.5">Keep last</tspan><tspan x="1085" dy="27.5">admitted app</tspan></text><text x="190" y="415.75" text-anchor="middle" font-size="22" fill="#253046"><tspan x="190" dy="0">Generic app contracts</tspan><tspan x="190" dy="27.5">Types + routes + forms</tspan><tspan x="190" dy="27.5">Exported from artifact</tspan></text><rect x="161.2" y="315" width="57.599999999999994" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="190" y="335" text-anchor="middle" font-size="20" fill="#253046"><tspan x="190" dy="0">read</tspan></text><text x="340" y="662.375" text-anchor="middle" font-size="23" fill="#253046"><tspan x="340" dy="0">Saved ≠ statically previewed ≠ admitted.</tspan><tspan x="340" dy="28.75">Studio never owns the domain model.</tspan><tspan x="340" dy="28.75">Only Platform admission changes the real app.</tspan></text><text x="50" y="824" fill="#555555" font-size="19"><tspan x="50" dy="0">Dashed: generic contract export being integrated from PR #126.</tspan><tspan x="50" dy="23.75">Diagram is the intended contract, not evidence of completed native/browser verification.</tspan></text></g></svg>