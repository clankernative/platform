<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title"><title id="title">ui-build-boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#253046"/></marker></defs><rect width="1200" height="900" fill="#ffffff"/><g font-family="Trebuchet MS, sans-serif"><rect x="55" y="160" width="285" height="130" rx="12" fill="#a5d8ff" stroke="#253046" stroke-width="2"/><path d="M340 225 L430 225" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="160" width="300" height="130" rx="12" fill="#d0bfff" stroke="#253046" stroke-width="2"/><path d="M730 225 L845 225" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845" y="160" width="300" height="130" rx="12" fill="#c3fae8" stroke="#253046" stroke-width="2"/><path d="M995 290 L995 450" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845" y="450" width="300" height="145" rx="12" fill="#ffd8a8" stroke="#253046" stroke-width="2"/><path d="M845 523 L730 523" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="450" width="300" height="145" rx="12" fill="#b2f2bb" stroke="#253046" stroke-width="2"/><path d="M430 523 L340 523" fill="none" stroke="#253046" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="450" width="285" height="145" rx="12" fill="#a5d8ff" stroke="#253046" stroke-width="2"/><rect x="430" y="320" width="300" height="90" rx="12" fill="#fff3bf" stroke="#253046" stroke-width="2" stroke-dasharray="8 6"/><rect x="55" y="655" width="1090" height="145" rx="12" fill="#fff3bf" stroke="#253046" stroke-width="2"/><text x="55" y="67" fill="#253046" font-size="32"><tspan x="55" dy="0">App UI toolchain — ownership and build boundary</tspan></text><text x="55" y="112" fill="#555555" font-size="22"><tspan x="55" dy="0">Target design · release delivery is replaceable · no CI vendor selected</tspan></text><text x="197.5" y="205.75" text-anchor="middle" font-size="22" fill="#253046"><tspan x="197.5" dy="0">App repository</tspan><tspan x="197.5" dy="27.5">Roc domain + routes</tspan><tspan x="197.5" dy="27.5">UI declarations + lock + theme</tspan></text><rect x="343.09000000000003" y="213.75" width="83.82" height="22.5" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="385" y="231.75" text-anchor="middle" font-size="18" fill="#253046"><tspan x="385" dy="0">capture</tspan></text><text x="580" y="205.75" text-anchor="middle" font-size="22" fill="#253046"><tspan x="580" dy="0">Clanker UI compiler</tspan><tspan x="580" dy="27.5">Locked component pack</tspan><tspan x="580" dy="27.5">Expand presentation only</tspan></text><rect x="740.46" y="213.75" width="94.08" height="22.5" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="787.5" y="231.75" text-anchor="middle" font-size="18" fill="#253046"><tspan x="787.5" dy="0">assemble</tspan></text><text x="995" y="205.75" text-anchor="middle" font-size="22" fill="#253046"><tspan x="995" dy="0">Ordinary build outputs</tspan><tspan x="995" dy="27.5">HTML templates + CSS</tspan><tspan x="995" dy="27.5">Browser modules + fonts</tspan></text><rect x="886.4" y="357.5" width="217.2" height="25" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="995" y="377.5" text-anchor="middle" font-size="20" fill="#253046"><tspan x="995" dy="0">independent checks</tspan></text><text x="995" y="503.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="995" dy="0">Platform admission</tspan><tspan x="995" dy="27.5">Types · forms · routes</tspan><tspan x="995" dy="27.5">Resource bytes + authority</tspan></text><rect x="755.85" y="511.75" width="63.3" height="22.5" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="787.5" y="529.75" text-anchor="middle" font-size="18" fill="#253046"><tspan x="787.5" dy="0">admit</tspan></text><text x="580" y="503.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="580" dy="0">Immutable app artifact</tspan><tspan x="580" dy="27.5">Pinned compiled app</tspan><tspan x="580" dy="27.5">Admitted UI + evidence</tspan></text><rect x="353.35" y="511.75" width="63.3" height="22.5" rx="4" fill="#ffffff" fill-opacity=".96"/><text x="385" y="529.75" text-anchor="middle" font-size="18" fill="#253046"><tspan x="385" dy="0">serve</tspan></text><text x="197.5" y="503.25" text-anchor="middle" font-size="22" fill="#253046"><tspan x="197.5" dy="0">App runtime</tspan><tspan x="197.5" dy="27.5">Pure domain decisions</tspan><tspan x="197.5" dy="27.5">Platform HTTP + storage</tspan></text><text x="580" y="347.5" text-anchor="middle" font-size="20" fill="#253046"><tspan x="580" dy="0">Setup / dependency restore</tspan><tspan x="580" dy="25">Verified release or local bundle</tspan><tspan x="580" dy="25">Separate execution approval</tspan></text><text x="600" y="707.375" text-anchor="middle" font-size="23" fill="#253046"><tspan x="600" dy="0">Control plane manages builds and releases; deployment topology remains open.</tspan><tspan x="600" dy="28.75">No Clanker compiler runs while serving a page.</tspan><tspan x="600" dy="28.75">First-party CLI defaults do not make Platform depend on Clanker components.</tspan></text><text x="55" y="843" fill="#555555" font-size="18"><tspan x="55" dy="0">Solid: existing architectural boundary · dashed: installation path being finished · not production qualification</tspan></text></g></svg>